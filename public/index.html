button:hover{background:var(--bg);border-color:var(--ac)}

.btn-success{background:var(--g);color:#fff;border-color:var(--g)}.btn-success:hover{opacity:.9}
.dng{background:var(--r);color:#fff;border-color:var(--r)}.dng:hover{opacity:.9}

/* Disability flag */
.dis-flag{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600}

.q-section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-top:12px}

</style></head><body>
<header>
<span class="logo">♿ Job Fair Tracker</span>
<span class="tag">PwD Hiring</span>
<div class="nav-links">
<a href="#/" id="nav-home">Companies</a>
<a href="#/multi" id="nav-multi">Multi-JD</a>
<a href="#/shortlist" id="nav-sl">Shortlisted</a>
</div>
<span class="mu">Screening score is rule-based, from form answers. CVs are linked, not read.</span>
<button id="reset">Reset all data</button>
</header>
<main class="wrap" id="app"></main>
<script>
let D;
const ZN={g:'Green',y:'Yellow',r:'Red'};
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let S={ov:{},log:[],sl:{},qe:{}};
try{const raw=JSON.parse(localStorage.getItem('jf')||'null');if(raw){S.ov=raw.ov||{};S.log=raw.log||[];S.sl=raw.sl||{};S.qe=raw.qe||{}}}catch(e){}
const save=()=>{try{localStorage.setItem('jf',JSON.stringify(S))}catch(e){}};

/* ====== Disability Benchmark Check ====== */
function parseDp(dp){
  if(!dp)return null;
  const m=dp.match(/[\d.]+/);
  if(!m)return null;
  let v=parseFloat(m[0]);
  if(v<=1)v=v*100; // handle 0.4 meaning 40%
  return v;
}
function disCheck(c){
  const dt=c.dt||'';
  const dp=c.dp||'';
  const pct=parseDp(dp);
  const hasType=!!dt.trim();
  const hasPct=pct!==null;
  const meetsMin=hasPct && pct>=40;
  return {hasType,hasPct,pct,meetsMin,
    ok: hasType && meetsMin,
    label: !hasType ? 'No disability info' : !hasPct ? 'No disability %' : !meetsMin ? `${pct}% < 40% benchmark` : `${pct}% ✓`,
    cls: (hasType && meetsMin)?'dis-ok':'dis-warn'
  };
}

/* ====== Experience Parsing & Strict Check ====== */
function parseYrs(t){
  if(!t)return null;
  t=t.toLowerCase();
  if(/fresh|no exp|nil|^0$/i.test(t))return 0;
  const ym=t.match(/(\d+)\s*year/);const mm=t.match(/(\d+)\s*month/);
  if(ym&&mm)return Math.round((parseInt(ym[1])+parseInt(mm[1])/12)*10)/10;
  const v=t.match(/\d+(?:\.\d+)?/g);
  if(!v||parseFloat(v[0])>40)return null;
  if(/month/.test(t)&&!/year/.test(t)&&v.length===1)return Math.round(parseFloat(v[0])/12*10)/10;
  if(v.length>=2&&/\d\s*[-–to]\s*\d/.test(t))return(parseFloat(v[0])+parseFloat(v[1]))/2;
  return parseFloat(v[0]);
}
function parseExpRange(e,title){
  if(!e)e='';
  e=e.toLowerCase();title=(title||'').toLowerCase();
  if(/fresher/.test(e)&&/experience/.test(e))return null;
  if(/fresher/.test(e)||((/fresher/.test(title))&&!e))return[0,1];
  let m=e.match(/(\d+)\s*[–\-]\s*(\d+)/);
  if(m)return[parseFloat(m[1]),parseFloat(m[2])];
  m=e.match(/(\d+)\s*(\+|yr|year)/);
  return m?[parseFloat(m[1]),null]:null;
}
function expMatch(candExp,jdExp,jdTitle){
  const y=parseYrs(candExp);
  const rng=parseExpRange(jdExp,jdTitle);
  if(y===null||rng===null)return {match:'unknown',y,rng,strict:false};
  const [lo,hi]=rng;
  const inRange=y>=lo && (hi===null||y<=hi+2);
  return {match:inRange?'yes':'no',y,rng,strict:!inRange};
}

/* ====== AI zone (recalculated with disability & experience strictness) ====== */
function ai(c,j){
  if(c._ai && c._ai_jid===j?.id)return c._ai;
  const base=c._a||(c._a={s:c.sc,z:c.sc>=D.thr[0]?'g':c.sc>=D.thr[1]?'y':'r',r:c.rs});
  if(!j){c._ai=base;c._ai_jid=null;return base}
  const dc=disCheck(c);
  const em=expMatch(c.e,j.e,j.t);
  let s=base.s;
  let reasons=[base.r];
  // Penalty: disability criteria not met -> cannot be green
  if(!dc.ok){
    reasons.push('⚠ Disability: '+dc.label);
    if(s>=D.thr[0])s=D.thr[0]-1; // drop from green
  }
  // Penalty: experience clearly out of range -> cannot be green
  if(em.strict){
    reasons.push('⚠ Experience mismatch: candidate '+em.y+'yrs vs JD '+(j.e||'not specified'));
    if(s>=D.thr[0])s=D.thr[0]-1;
  }
  const z=s>=D.thr[0]?'g':s>=D.thr[1]?'y':'r';
  const result={s,z,r:reasons.join('; ')};
  c._ai=result;c._ai_jid=j?.id;
  return result;
}
const jdOf=c=>S.ov[c.id]?.jd??c.jd;
const zone=(c,j)=>{
  const ov=S.ov[c.id]?.z;
  if(ov)return ov;
  return ai(c,j||D.jds[jdOf(c)]).z;
};
const gone=c=>!!S.ov[c.id]?.rm;
const byJd=id=>C.filter(c=>jdOf(c)===id);
function st(l,jdId){const o={g:0,y:0,r:0,n:0};const j=jdId!=null?D.jds[jdId]:null;l.forEach(c=>{if(gone(c))return;o[zone(c,j)]++;o.n++});return o}
const chips=o=>`<span class="chip cg">${o.g} green</span><span class="chip cy">${o.y} yellow</span><span class="chip cr">${o.r} red</span>`;
const set=(id,p,msg)=>{S.ov[id]=Object.assign(S.ov[id]||{},p);S.log.unshift(new Date().toLocaleString()+': '+msg);S.log=S.log.slice(0,100);save();render()};
let pend=null,showRm=false,sheet=false,activeTab='zones';
const head=(t,sub,back)=>`${back?`<a class="back" href="${back[0]}">← ${E(back[1])}</a>`:''}<h1>${E(t)}</h1>${sub?`<p class="mu">${sub}</p>`:''}`;

/* ====== Screening Questions Generator ====== */
const Q_BANK={
  general:[
    {cat:'Introduction',q:'Can you briefly introduce yourself and walk me through your work experience?'},
    {cat:'Motivation',q:'Why are you interested in this role, and what attracted you to our company?'},
    {cat:'Accommodation',q:'Do you require any specific workplace accommodations or assistive technology? If yes, please describe.'},
    {cat:'Availability',q:'What is your notice period, and when can you join?'},
    {cat:'Salary',q:'What are your current and expected CTC?'},
    {cat:'Location',q:'Are you comfortable working from the specified location? Are you open to relocation if required?'},
  ],
  tech:[
    {cat:'Technical',q:'Can you describe a challenging technical problem you solved recently?'},
    {cat:'Technical',q:'What programming languages, frameworks, or tools are you proficient in?'},
    {cat:'Technical',q:'How do you stay updated with the latest technology trends?'},
    {cat:'Technical',q:'Describe your experience with debugging and troubleshooting production issues.'},
  ],
  nontech:[
    {cat:'Communication',q:'How do you handle difficult customer interactions or complaints?'},
    {cat:'Communication',q:'Can you give an example of a time you worked effectively in a team?'},
    {cat:'Process',q:'Describe a situation where you had to manage multiple tasks with tight deadlines.'},
    {cat:'Process',q:'How do you prioritize your daily tasks?'},
  ],
  leadership:[
    {cat:'Leadership',q:'Have you managed a team before? If yes, describe your management style.'},
    {cat:'Leadership',q:'How do you handle conflicts within your team?'},
  ],
  fresher:[
    {cat:'Academic',q:'Tell us about your educational background and any relevant projects.'},
    {cat:'Academic',q:'What skills from your studies do you think apply to this role?'},
    {cat:'Internship',q:'Have you completed any internships? What did you learn from them?'},
  ]
};
function genQuestions(j){
  const t=j.t.toLowerCase();const ty=j.ty.toLowerCase();const e=j.e.toLowerCase();
  let qs=[...Q_BANK.general];
  if(ty.includes('tech')&&!ty.includes('non'))qs.push(...Q_BANK.tech);
  else qs.push(...Q_BANK.nontech);
  if(/manager|lead|senior|sr\.|head/i.test(t))qs.push(...Q_BANK.leadership);
  if(/fresh|intern|0|entry/i.test(e+' '+t))qs.push(...Q_BANK.fresher);
  // Role-specific questions
  if(/network/i.test(t))qs.push({cat:'Role-Specific',q:'Explain your experience with L2/L3 networking, routing protocols, and network troubleshooting.'});
  if(/security|soc|infosec/i.test(t))qs.push({cat:'Role-Specific',q:'Describe your experience with SIEM tools, incident response, and vulnerability management.'});
  if(/data|analyst|bi/i.test(t))qs.push({cat:'Role-Specific',q:'What data analysis tools and databases have you worked with (SQL, Python, Tableau, etc.)?'});
  if(/customer|support|service|csa/i.test(t))qs.push({cat:'Role-Specific',q:'How do you handle high-pressure customer interactions? Describe a specific example.'});
  if(/sales|telesales/i.test(t))qs.push({cat:'Role-Specific',q:'What is your experience with sales targets? How do you handle rejection?'});
  if(/content|moderator/i.test(t))qs.push({cat:'Role-Specific',q:'Are you comfortable reviewing sensitive or graphic content? How do you manage the emotional impact?'});
  if(/engineer|developer|sde|fullstack|backend|frontend/i.test(t))qs.push({cat:'Role-Specific',q:'Describe a project you have built end-to-end. What was your architecture and tech stack?'});
  if(/devops|devsecops|infra/i.test(t))qs.push({cat:'Role-Specific',q:'What CI/CD tools and cloud platforms have you worked with?'});
  if(/picker|packer|warehouse|retail/i.test(t))qs.push({cat:'Role-Specific',q:'Are you comfortable with physical tasks such as standing, lifting, or moving inventory for extended periods?'});
  if(/account|finance/i.test(t))qs.push({cat:'Role-Specific',q:'Describe your experience with financial reporting, accounting software, or ERP systems.'});
  if(/plant|engineering|automation/i.test(t))qs.push({cat:'Role-Specific',q:'What experience do you have with plant operations, automation systems, or industrial equipment?'});
  return qs;
}
function getJdQuestions(jid){
  const saved=S.qe[jid];
  if(saved)return saved;
  const j=D.jds[jid];
  return genQuestions(j).map(q=>({cat:q.cat,q:q.q}));
}
function saveQuestion(jid,idx,val){
  if(!S.qe[jid])S.qe[jid]=[...getJdQuestions(jid)];
  S.qe[jid][idx].q=val;
  save();
}
function addQuestion(jid,cat,q){
  if(!S.qe[jid])S.qe[jid]=[...getJdQuestions(jid)];
  S.qe[jid].push({cat:cat||'Custom',q:q||'New question - click to edit'});
  save();render();
}
function removeQuestion(jid,idx){
  if(!S.qe[jid])S.qe[jid]=[...getJdQuestions(jid)];
  S.qe[jid].splice(idx,1);
  save();render();
}

/* ====== Multi-JD Candidates ====== */
function getMultiJdCandidates(){
  const map={};
  C.forEach(c=>{
    if(gone(c))return;
    const key=(c.em||c.ph||c.n).toLowerCase();
    if(!map[key])map[key]={person:c,jids:new Set()};
    map[key].jids.add(jdOf(c));
  });
  return Object.values(map).filter(x=>x.jids.size>1).sort((a,b)=>b.jids.size-a.jids.size);
}

/* ====== Shortlist ====== */
function isShortlisted(cid){return !!S.sl[cid]}
function toggleShortlist(cid){
  if(S.sl[cid]){delete S.sl[cid];S.log.unshift(new Date().toLocaleString()+': Removed from shortlist');} 
  else{const c=C.find(x=>x.id===cid);S.sl[cid]={jd:jdOf(c),ts:Date.now(),notes:''};S.log.unshift(new Date().toLocaleString()+': '+c.n+' shortlisted');}
  S.log=S.log.slice(0,100);save();render();
}
function updateSlNotes(cid,notes){
  if(S.sl[cid])S.sl[cid].notes=notes;
  save();
}
function getShortlisted(){
  return Object.entries(S.sl).map(([cid,info])=>{
    const c=C.find(x=>x.id===cid);
    if(!c)return null;
    return{c,jd:D.jds[info.jd],info};
  }).filter(Boolean).sort((a,b)=>(b.info.ts||0)-(a.info.ts||0));
}

/* ====== Views ====== */
let C=[];
function vHome(){
  const un=C.filter(c=>jdOf(c)==null&&!gone(c));
  const allLive=C.filter(c=>!gone(c));
  const uniquePeople=new Set(allLive.map(c=>(c.em||c.ph||c.n).toLowerCase())).size;
  const multiCount=getMultiJdCandidates().length;
  const slCount=Object.keys(S.sl).length;
  let h=head('PwD Disability Job Fair','Candidate screening & shortlisting dashboard');
  // Stats bar
  h+=`<div class="stats-bar">
    <div class="stat"><div class="stat-val">${uniquePeople}</div><div class="stat-label">Total People</div></div>
    <div class="stat"><div class="stat-val">${D.jds.length}</div><div class="stat-label">Total JDs</div></div>
    <div class="stat"><div class="stat-val">${multiCount}</div><div class="stat-label">Multi-JD Matches</div></div>
    <div class="stat"><div class="stat-val">${slCount}</div><div class="stat-label">Shortlisted</div></div>
  </div>`;
  h+='<div class="grid">';
  D.cos.forEach((n,i)=>{const js=D.jds.filter(j=>j.c===i),s=st(js.flatMap(j=>byJd(j.id)));
   h+=`<a class="card" href="#/c/${i}"><b>${E(n)}</b><div class="mu">${js.length} JD${js.length==1?'':'s'}, ${s.n?s.n+' candidate'+(s.n==1?'':'s'):'no applicants yet'}</div>${s.n?`<div class="chips">${chips(s)}</div>`:''}</a>`;});
  if(un.length)h+=`<a class="card warn" href="#/u"><b>Unassigned</b><div class="mu">${un.length} candidates whose role matched no JD</div></a>`;
  h+='</div>';
  // Change log
  h+='<details><summary>Change log ('+S.log.length+')</summary>'+(S.log.map(l=>'<div class="mu">'+E(l)+'</div>').join('')||'<div class="mu">No changes yet.</div>')+'</details>';
  return h;
}

function vCo(i){i=+i;const js=D.jds.filter(j=>j.c===i);
  let h=head(D.cos[i],js.length+' JDs',['#/','All companies'])+'<div class="list">';
  js.forEach(j=>{const s=st(byJd(j.id),j.id);
   h+=`<div class="card row"><div class="g1"><a class="tt" href="#/j/${j.id}">${E(j.t)}</a><div class="mu"><span class="tag">${E(j.ty)}</span> ${E(j.e)}${j.e&&j.l?', ':''}${E(j.l)} ${j.u?`<a href="${E(j.u)}" target="_blank" rel="noopener">JD file</a>`:''}</div></div><div class="rt"><div class="mu">${s.n?s.n+' candidate'+(s.n==1?'':'s'):'No applicants yet'}</div>${s.n?`<div class="chips">${chips(s)}</div><div class="act" style="justify-content:flex-end"><button data-xl="${j.id}">⬇ .xlsx</button></div>`:''}</div></div>`;});
  return h+'</div>';
}

function cc(c,j){
  const a=ai(c,j),z=zone(c,j),o=S.ov[c.id]||{};
  const dc=disCheck(c);
  const sl=isShortlisted(c.id);
  const opts=['g','y','r'].filter(x=>x!==z).map(x=>`<option value="${x}">${ZN[x]}</option>`).join('');
  const rmUI=pend===c.id?`<span class="mu">Remove?</span><button class="dng" data-rm2="${c.id}">Yes</button><button data-rc>No</button>`:`<button data-rm="${c.id}">Remove</button>`;
  return `<div class="cc z${z}"><div class="top">${c.cv?`<a class="nm" href="${E(c.cv)}" target="_blank" rel="noopener" title="Open CV">${E(c.n)} 📄</a>`:`<b>${E(c.n)}</b>`}${c.pool?'<span class="tag">Pool match</span>':''}
  <span class="dis-flag ${dc.cls}" title="Disability: ${E(dc.label)}">${dc.ok?'♿✓':'⚠'} ${E(dc.label)}</span>
  <span class="sc" title="Screening score">${a.s}</span></div>
<div class="mu">${E(c.org)}, ${E(c.e)}, ${E(c.loc)}, ${E(c.np)} notice</div><div class="why">${E(a.r)}</div>
${o.z&&o.z!==ai(c,j).z?`<div class="ovr">Moved by you. AI said ${ZN[ai(c,j).z]}.</div>`:''}
${c.dt?`<div class="mu">Disability: ${E(c.dt)} | ${E(c.dp||'% not provided')}</div>`:''}
${c.note?`<div class="note">Team note: ${E(c.note)}</div>`:''}
<div class="mu">${E(c.em)}, ${E(c.ph)}</div>
<details><summary>Full application</summary><div class="mu">Applied for: ${E(c.role)}<br>Qualification: ${E(c.q||'n/a')}<br>Skills: ${E(c.sk||'n/a')}<br>Current CTC: ${E(c.ct||'n/a')}. Expected: ${E(c.ex||'n/a')}<br>Applied: ${E(c.ts||'n/a')} (sheet: ${E(c.src)})<br>${c.cv?`<a href="${E(c.cv)}" target="_blank" rel="noopener">Open CV</a>`:'No CV link in the form'}</div></details>
<div class="act"><select data-mv="${c.id}"><option value="">Move to…</option>${opts}</select>${z==='g'?`<button class="${sl?'dng':'btn-success'}" data-sl="${c.id}">${sl?'✕ Un-shortlist':'✓ Shortlist'}</button>`:''}${rmUI}</div></div>`;
}

const COLS=['Timestamp','Job Role','Name','Mail id','Contact No','Current Organization','Relevant experience in years','Relevant Skillset','Disability Type','Disability%','Current location','Preferred Relocation','Current ctc','Expected ctc','Notice Period','Full Address','Upload cv','Screening Notes'];
const note=c=>{const j=D.jds[jdOf(c)];return`${ZN[zone(c,j)]} (${ai(c,j).s})`+(c.note?' | '+c.note:'')+(c.pool?' | Talent-pool match, their role: '+(c.role||'n/a'):'')+' | '+ai(c,j).r};
const rowOf=(c,j)=>[c.ts,j.t,c.n,c.em,c.ph,c.org,c.e,c.sk,c.dt,c.dp,c.loc,c.pr,c.ct,c.ex,c.np,c.ad,c.cv,note(c)].map(v=>v==null?'':v);
const listFor=(id)=>{const j=D.jds[id];return byJd(id).filter(c=>!gone(c)).sort((a,b)=>'gyr'.indexOf(zone(a,j))-'gyr'.indexOf(zone(b,j))||ai(b,j).s-ai(a,j).s)};

function vSheet(id){const j=D.jds[id],l=listFor(id);
  return `<p class="mu">${l.length} rows, coloured green, yellow or red by zone. Your moves and removals are included.</p><div class="tw"><table class="sh"><thead><tr>${COLS.map(c=>`<th>${E(c)}</th>`).join('')}</tr></thead><tbody>${l.map(c=>`<tr class="t${zone(c,j)}">${rowOf(c,j).map((v,i)=>`<td title="${E(v)}">${i===16&&v?`<a href="${E(v)}" target="_blank" rel="noopener">Open CV</a>`:E(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function vQuestions(jid){
  const qs=getJdQuestions(jid);
  let h=`<div class="q-section"><h3>📋 HR Screening Questions <span class="mu">(${qs.length} questions)</span></h3>`;
  h+=`<div class="act" style="margin-bottom:12px"><button class="btn-primary" data-dlq="${jid}">⬇ Download Questions (.xlsx)</button><button data-addq="${jid}">+ Add Question</button><button data-resetq="${jid}">↺ Reset to Default</button></div>`;
  qs.forEach((q,i)=>{
    h+=`<div class="q-item"><span class="q-num">${i+1}</span><div class="q-text"><div class="q-cat">${E(q.cat)}</div><textarea data-qedit="${jid}" data-qi="${i}" rows="1">${E(q.q)}</textarea></div><button class="dng" data-rmq="${jid}" data-rqi="${i}" title="Remove question" style="align-self:center;padding:2px 8px;font-size:11px">✕</button></div>`;
  });
  h+='</div>';
  return h;
}

function vJd(id){id=+id;const j=D.jds[id],all=byJd(id),live=all.filter(c=>!gone(c));
  let h=head(j.t,`${E(D.cos[j.c])}, ${E(j.ty)}${j.e?', '+E(j.e):''}${j.l?', '+E(j.l):''}.${j.u?` <a href="${E(j.u)}" target="_blank" rel="noopener">JD file</a>`:''}`,['#/c/'+j.c,D.cos[j.c]]);
  if(!all.length)return h+'<div class="card"><b>No candidates have applied for this role yet.</b></div>'+vQuestions(id);
  // Tabs
  h+=`<div class="tabs"><button class="${activeTab==='zones'?'active':''}" data-tab="zones">Candidates (${live.length})</button><button class="${activeTab==='sheet'?'active':''}" data-tab="sheet">Sheet View</button><button class="${activeTab==='questions'?'active':''}" data-tab="questions">Screening Questions</button></div>`;
  h+=`<div class="act" style="margin:8px 0"><button data-xl="${id}">⬇ Download .xlsx</button></div>`;
  if(activeTab==='questions')return h+vQuestions(id);
  if(activeTab==='sheet')return h+vSheet(id);
  // Zones view
  h+='<div class="cols">';
  ['g','y','r'].forEach(z=>{const l=live.filter(c=>zone(c,j)===z).sort((a,b)=>ai(b,j).s-ai(a,j).s);
   h+=`<section class="col"><h3 class="h${z}">${ZN[z]}<span>${l.length}</span></h3>${l.map(c=>cc(c,j)).join('')||'<p class="mu">No candidates here.</p>'}</section>`;});
  h+='</div>';const rm=all.filter(gone);
  if(rm.length)h+=`<p><button data-sr>${showRm?'Hide':'Show'} removed (${rm.length})</button></p>`+(showRm?rm.map(c=>`<div class="cc"><b>${E(c.n)}</b><div class="act"><button data-rs="${c.id}">Restore</button></div></div>`).join(''):'');
  return h;
}

/* ====== Multi-JD View ====== */
function vMulti(){
  const multi=getMultiJdCandidates();
  let h=head('Multi-JD Candidates',`${multi.length} candidates matching 2 or more JDs`,['#/','Home']);
  h+=`<div class="act" style="margin:10px 0"><button data-xlmulti>⬇ Download Multi-JD (.xlsx)</button></div>`;
  if(!multi.length)return h+'<div class="card"><b>No candidates currently match multiple JDs.</b></div>';
  multi.forEach(({person:c,jids})=>{
    const dc=disCheck(c);
    h+=`<div class="card" style="margin-bottom:8px"><div class="top">${c.cv?`<a class="nm" href="${E(c.cv)}" target="_blank" rel="noopener">${E(c.n)} 📄</a>`:`<b>${E(c.n)}</b>`}
    <span class="multi-badge">${jids.size} JDs</span>
    <span class="dis-flag ${dc.cls}">${dc.ok?'♿✓':'⚠'} ${E(dc.label)}</span></div>
    <div class="mu">${E(c.org)} | ${E(c.e)} | ${E(c.loc)} | ${E(c.em)} | ${E(c.ph)}</div>
    <div class="chips" style="margin-top:6px">${[...jids].map(jid=>{const j=D.jds[jid];return j?`<a href="#/j/${jid}" class="chip tag-blue" style="text-decoration:none">${E(j.t.substring(0,40))}</a>`:''}).join('')}</div>
    </div>`;
  });
  return h;
}

/* ====== Shortlist View ====== */
function vShortlist(){
  const items=getShortlisted();
  let h=head('Shortlisted Candidates',`${items.length} candidates manually shortlisted by HR`,['#/','Home']);
  h+=`<div class="act" style="margin:10px 0"><button data-xlsl>⬇ Download Shortlist (.xlsx)</button></div>`;
  if(!items.length)return h+'<div class="card"><b>No candidates shortlisted yet.</b><p class="mu">Go to a JD, and click "✓ Shortlist" on green-zone candidates to add them here.</p></div>';
  items.forEach(({c,jd,info})=>{
    const dc=disCheck(c);
    h+=`<div class="sl-card"><div class="top">${c.cv?`<a class="nm" href="${E(c.cv)}" target="_blank" rel="noopener">${E(c.n)} 📄</a>`:`<b>${E(c.n)}</b>`}
    <span class="dis-flag ${dc.cls}">${dc.ok?'♿✓':'⚠'} ${E(dc.label)}</span></div>
    <div class="sl-jd">JD: <a href="#/j/${jd.id}">${E(jd.t)}</a> (${E(D.cos[jd.c])})</div>
    <div class="mu">${E(c.org)} | ${E(c.e)} exp | ${E(c.loc)} | ${E(c.q||'—')}</div>
    <div class="mu">${E(c.em)} | ${E(c.ph)}</div>
    <div style="margin-top:4px"><label class="mu">Notes: </label><input class="inline-edit" type="text" value="${E(info.notes||'')}" data-slnote="${c.id}" placeholder="Add notes…" style="width:70%"></div>
    <div class="act"><button class="dng" data-slrm="${c.id}">Remove from shortlist</button></div></div>`;
  });
  return h;
}

function vUn(){const l=C.filter(c=>jdOf(c)==null);
  let h=head('Unassigned','These candidates applied for a role that matched no JD. Assign each to a JD, or remove them.',['#/','All companies']);
  h+=l.map(c=>{const js=D.jds.filter(j=>j.c===c.co);
   return `<div class="card row"><div class="g1"><b>${E(c.n)}</b><div class="mu">Applied for "${E(c.role)}" on the ${E(D.cos[c.co])} sheet</div></div><div class="act">`+(gone(c)?`<span class="mu">Removed</span><button data-rs="${c.id}">Restore</button>`:`<select data-as="${c.id}"><option value="">Assign to JD…</option>${js.map(j=>`<option value="${j.id}">${E(j.t)}</option>`).join('')}</select><button data-rm2="${c.id}">Remove</button>`)+`</div></div>`}).join('')||'<p class="mu">Nothing unassigned.</p>';
  return h;
}

/* ====== Excel builders ====== */
function buildWb(id){const j=D.jds[id],wb=new ExcelJS.Workbook(),ws=wb.addWorksheet(j.t.replace(/[\\/?*\[\]:]/g,' ').slice(0,31)||'JD');
  ws.addRow(COLS).eachCell(x=>{x.font={bold:true,color:{argb:'FFFFFFFF'}};x.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1F2937'}}});
  const FL={g:'FFC6EFCE',y:'FFFFEB9C',r:'FFFFC7CE'};
  listFor(id).forEach(c=>{const r=ws.addRow(rowOf(c,j));r.eachCell({includeEmpty:true},x=>{x.fill={type:'pattern',pattern:'solid',fgColor:{argb:FL[zone(c,j)]}}});if(c.cv)r.getCell(17).value={text:c.cv,hyperlink:c.cv}});
  [20,34,24,28,14,26,14,34,18,10,18,22,12,12,14,36,36,60].forEach((w,i)=>ws.getColumn(i+1).width=w);
  ws.views=[{state:'frozen',ySplit:1}];ws.autoFilter={from:'A1',to:{row:1,column:18}};return wb;
}
function buildQuestionsWb(jid){
  const j=D.jds[jid],wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet('Screening Questions');
  ws.addRow(['#','Category','Question']).eachCell(x=>{x.font={bold:true,color:{argb:'FFFFFFFF'}};x.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF4F46E5'}}});
  getJdQuestions(jid).forEach((q,i)=>{ws.addRow([i+1,q.cat,q.q])});
  ws.getColumn(1).width=5;ws.getColumn(2).width=18;ws.getColumn(3).width=80;
  ws.views=[{state:'frozen',ySplit:1}];
  // Add JD info header
  ws.insertRow(1,['JD: '+j.t+' | Company: '+D.cos[j.c]]);
  ws.mergeCells('A1:C1');
  ws.getCell('A1').font={bold:true,size:13};
  return wb;
}
function buildMultiWb(){
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Multi-JD Candidates');
  ws.addRow(['Name','Email','Phone','Organization','Experience','Location','Disability Type','Disability %','Skills','Qualification','Matching JDs','JD Count']).eachCell(x=>{x.font={bold:true,color:{argb:'FFFFFFFF'}};x.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF7C3AED'}}});
  getMultiJdCandidates().forEach(({person:c,jids})=>{
    const jdNames=[...jids].map(jid=>D.jds[jid]?.t||'').join('; ');
    ws.addRow([c.n,c.em,c.ph,c.org,c.e,c.loc,c.dt,c.dp,c.sk,c.q,jdNames,jids.size]);
  });
  [24,28,14,26,14,18,20,10,34,18,60,8].forEach((w,i)=>ws.getColumn(i+1).width=w);
  ws.views=[{state:'frozen',ySplit:1}];ws.autoFilter={from:'A1',to:{row:1,column:12}};
  return wb;
}
function buildSlWb(){
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Shortlisted');
  ws.addRow(['Name','Email','Phone','Organization','Experience','Location','Qualification','Skills','Disability Type','Disability %','JD Title','Company','HR Notes']).eachCell(x=>{x.font={bold:true,color:{argb:'FFFFFFFF'}};x.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF157347'}}});
  getShortlisted().forEach(({c,jd,info})=>{
    ws.addRow([c.n,c.em,c.ph,c.org,c.e,c.loc,c.q,c.sk,c.dt,c.dp,jd.t,D.cos[jd.c],info.notes||'']);
  });
  [24,28,14,26,14,18,18,34,20,10,34,20,40].forEach((w,i)=>ws.getColumn(i+1).width=w);
  ws.views=[{state:'frozen',ySplit:1}];ws.autoFilter={from:'A1',to:{row:1,column:13}};
  return wb;
}

let xp;const loadX=()=>xp||(xp=new Promise((ok,no)=>{if(window.ExcelJS)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';s.onload=ok;s.onerror=()=>{xp=null;no()};document.head.appendChild(s)}));
async function dl(id){try{await loadX()}catch(e){alert('Could not load the Excel library. Check your connection and try again.');return}
  const j=D.jds[id],buf=await buildWb(id).xlsx.writeBuffer(),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=(D.cos[j.c]+' - '+j.t).replace(/[^\w\-. &()]+/g,' ').trim().slice(0,90)+'.xlsx';document.body.appendChild(a);a.click();a.remove()}
async function dlQ(jid){try{await loadX()}catch(e){alert('Excel library error');return}
  const j=D.jds[jid],buf=await buildQuestionsWb(jid).xlsx.writeBuffer(),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download='Screening Questions - '+j.t.replace(/[^\w\-. &()]+/g,' ').trim().slice(0,60)+'.xlsx';document.body.appendChild(a);a.click();a.remove()}
async function dlMulti(){try{await loadX()}catch(e){alert('Excel library error');return}
  const buf=await buildMultiWb().xlsx.writeBuffer(),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download='Multi-JD Candidates.xlsx';document.body.appendChild(a);a.click();a.remove()}
async function dlSl(){try{await loadX()}catch(e){alert('Excel library error');return}
  const buf=await buildSlWb().xlsx.writeBuffer(),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download='Shortlisted Candidates.xlsx';document.body.appendChild(a);a.click();a.remove()}

/* ====== Render & Events ====== */
const app=$('#app');
function updateNav(){
  const h=location.hash;
  document.querySelectorAll('.nav-links a').forEach(a=>{a.classList.toggle('active',a.getAttribute('href')===h||(!h&&a.id==='nav-home'))});
}
function render(){
  if(!D)return;
  updateNav();
  const[v,a]=location.hash.slice(2).split('/');
  app.innerHTML=v==='c'?vCo(a):v==='j'?vJd(a):v==='u'?vUn():v==='multi'?vMulti():v==='shortlist'?vShortlist():vHome();
}

// Delegated events
app.addEventListener('change',e=>{const t=e.target,c=C.find(x=>x.id===(t.dataset.mv||t.dataset.as));if(!c||!t.value)return;
  if(t.dataset.mv)set(c.id,{z:t.value},`${c.n}: ${ZN[zone(c)]} to ${ZN[t.value]}`);else set(c.id,{jd:+t.value},`${c.n}: assigned to ${D.jds[+t.value].t}`)});

app.addEventListener('input',e=>{
  const t=e.target;
  // Question editing
  if(t.dataset.qedit!==undefined){
    saveQuestion(+t.dataset.qedit,+t.dataset.qi,t.value);
  }
  // Shortlist notes editing
  if(t.dataset.slnote!==undefined){
    updateSlNotes(t.dataset.slnote,t.value);
  }
});

app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,f=k=>C.find(x=>x.id===d[k]);
  if(d.rm){pend=d.rm;render()}else if('rc' in d){pend=null;render()}
  else if(d.rm2){const c=f('rm2');pend=null;set(c.id,{rm:1},c.n+': removed')}
  else if(d.rs){const c=f('rs');set(c.id,{rm:0},c.n+': restored')}
  else if('sr' in d){showRm=!showRm;render()}
  else if(d.xl){dl(+d.xl)}
  else if(d.tab){activeTab=d.tab;render()}
  else if(d.sl){toggleShortlist(d.sl)}
  else if(d.slrm){toggleShortlist(d.slrm)}
  else if(d.dlq){dlQ(+d.dlq)}
  else if(d.addq){addQuestion(+d.addq)}
  else if(d.rmq!==undefined){removeQuestion(+d.rmq,+d.rqi)}
  else if(d.resetq!==undefined){delete S.qe[+d.resetq];save();render()}
  else if('xlmulti' in d){dlMulti()}
  else if('xlsl' in d){dlSl()}
});

addEventListener('hashchange',()=>{pend=null;showRm=false;activeTab='zones';render();scrollTo(0,0)});
$('#reset').onclick=()=>{if(confirm('This will reset ALL your changes (zone moves, shortlists, notes, custom questions). Continue?')){S={ov:{},log:[],sl:{},qe:{}};save();render()}};

const api=async p=>{const r=await fetch('/api/data',{headers:{'x-password':p||''}});if(!r.ok)throw r.status;return r.json()};
function start(d){D=d;C=D.pl.map((p,i)=>Object.assign({id:'p'+i},D.people[p[1]],{jd:p[0],co:D.jds[p[0]].c,sc:p[2],rs:p[3],pool:p[4]}));render()}
function login(s,tried){app.innerHTML=s===503?'<div class="card"><b>Not configured yet.</b><p class="mu">Set SITE_PASSWORD (or PUBLIC_ACCESS=true) in Vercel and redeploy.</p></div>':`<div class="card" style="max-width:380px;margin:40px auto"><b style="font-size:18px">🔒 Password Required</b><p class="mu">${tried?'Wrong password. ':''}Ask the organiser for access.</p><input id="pw" type="password" placeholder="Enter password…" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)"><button id="go" class="btn-primary" style="width:100%;padding:10px">Open Dashboard</button></div>`;
  const go=$('#go');if(go)go.onclick=async()=>{const p=$('#pw').value;try{start(await api(p));try{sessionStorage.setItem('pw',p)}catch(e){}}catch(e){login(e,1)}}}
(async()=>{let p='';try{p=sessionStorage.getItem('pw')||''}catch(e){}try{start(await api(p))}catch(s){login(s,0)}})();
</script></body></html>
