<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Job Fair Tracker – PwD Disability Hiring</title><meta name="robots" content="noindex">
<meta name="description" content="Disability job fair candidate tracker with screening, shortlisting and HR question bank.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1b1f24;--mu:#5d6772;--bd:#e1e5ea;--ac:#4f46e5;--ach:#3730a3;--g:#157347;--gb:#e3f4ea;--y:#8a6100;--yb:#fff3d1;--r:#b3261e;--rb:#fde8e6;--blue:#2563eb;--bluebg:#eff6ff;--purple:#7c3aed;--purplebg:#f5f3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#1a1d27;--tx:#e8ebef;--mu:#9aa5b1;--bd:#2c323a;--ac:#818cf8;--ach:#a5b4fc;--g:#5fd39a;--gb:#17352a;--y:#f1c657;--yb:#3a2f10;--r:#ff8b82;--rb:#3d1b19;--blue:#60a5fa;--bluebg:#1e293b;--purple:#a78bfa;--purplebg:#1e1b3a}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#1a1d27;--tx:#e8ebef;--mu:#9aa5b1;--bd:#2c323a;--ac:#818cf8;--ach:#a5b4fc;--g:#5fd39a;--gb:#17352a;--y:#f1c657;--yb:#3a2f10;--r:#ff8b82;--rb:#3d1b19;--blue:#60a5fa;--bluebg:#1e293b;--purple:#a78bfa;--purplebg:#1e1b3a}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;backdrop-filter:blur(12px);background:rgba(255,255,255,0.85)}
@media(prefers-color-scheme:dark){header{background:rgba(26,29,39,0.88)}}
header .logo{font-weight:700;font-size:16px;background:linear-gradient(135deg,var(--ac),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header #reset{margin-left:auto}
header .nav-links{display:flex;gap:4px}
header .nav-links a{text-decoration:none;font-size:13px;font-weight:500;padding:4px 10px;border-radius:6px;color:var(--mu);transition:all .2s}
header .nav-links a:hover,header .nav-links a.active{background:var(--ac);color:#fff}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:6px 0 4px;font-weight:700}h2{font-size:18px;margin:8px 0 6px;font-weight:600}h3{margin:0 0 8px;font-size:15px;font-weight:600}
a{color:var(--ac);transition:color .15s}a:hover{color:var(--ach)}.mu{color:var(--mu);font-size:13px}.back{font-size:13px;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:14px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;transition:transform .15s,box-shadow .15s}
a.card{display:block;color:inherit;text-decoration:none}a.card:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}.warn{border-style:dashed}
.chips{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.chip,.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.02em}
.cg,.hg{background:var(--gb);color:var(--g)}.cy,.hy{background:var(--yb);color:var(--y)}.cr,.hr{background:var(--rb);color:var(--r)}
.tag{background:var(--bd);color:var(--mu)}
.tag-blue{background:var(--bluebg);color:var(--blue)}
.tag-purple{background:var(--purplebg);color:var(--purple)}
.tag-warn{background:var(--rb);color:var(--r);font-weight:600;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.list{display:grid;gap:8px;margin-top:12px}.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.g1{flex:1;min-width:220px}.rt{text-align:right}
.tt{font-weight:600;color:var(--tx);text-decoration:none}.tt:hover{text-decoration:underline}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;align-items:start}
@media(max-width:800px){.cols{grid-template-columns:1fr}.rt{text-align:left}}
.col h3{padding:6px 10px;border-radius:8px;display:flex;justify-content:space-between}
.cc{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:grid;gap:4px;transition:all .15s}
.cc:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.zg{border-left-color:var(--g)}.zy{border-left-color:var(--y)}.zr{border-left-color:var(--r)}
.top{display:flex;gap:6px;align-items:center}.sc{margin-left:auto;font-weight:700}
.why{font-size:13px}.note{font-size:13px;background:var(--bg);padding:4px 8px;border-radius:6px}.ovr{font-size:12px;font-weight:600;color:var(--y)}
.act{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
button,select{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer;transition:all .15s;font-weight:500}
button:hover{background:var(--bg);border-color:var(--ac)}
.btn-primary{background:var(--ac);color:#fff;border-color:var(--ac)}.btn-primary:hover{background:var(--ach)}
.btn-success{background:var(--g);color:#fff;border-color:var(--g)}.btn-success:hover{opacity:.9}
.dng{background:var(--r);color:#fff;border-color:var(--r)}.dng:hover{opacity:.9}
details{margin-top:6px}
[hidden]{display:none!important}
.nm{font-weight:700;color:var(--ac)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;margin-top:8px}table.sh{border-collapse:collapse;font-size:12px;min-width:1600px}.sh th,.sh td{padding:5px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;text-align:left}.sh th{position:sticky;top:0;background:var(--card);font-weight:600}.sh tr.tg td{background:var(--gb)}.sh tr.ty td{background:var(--yb)}.sh tr.tr td{background:var(--rb)}
/* Disability flag */
.dis-flag{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600}
.dis-ok{background:var(--gb);color:var(--g)}.dis-warn{background:var(--rb);color:var(--r)}
/* Questions section */
.q-section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-top:12px}
.q-section h3{margin-bottom:12px}
.q-item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bd)}
.q-item:last-child{border-bottom:none}
.q-num{min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--ac);color:#fff;border-radius:50%;font-size:11px;font-weight:700;flex-shrink:0}
.q-text{flex:1;font-size:14px;line-height:1.5}
.q-text textarea{width:100%;min-height:36px;border:1px solid var(--bd);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;resize:vertical;background:var(--bg);color:var(--tx)}
.q-cat{font-size:11px;font-weight:600;color:var(--purple);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.q-add{margin-top:8px}
/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--bd);margin-bottom:14px}
.tabs button{border:none;background:none;padding:8px 16px;font-weight:500;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;font-size:14px;transition:all .15s}
.tabs button.active{color:var(--ac);border-bottom-color:var(--ac);font-weight:600}
.tabs button:hover{color:var(--tx)}
/* Shortlist */
.sl-card{background:var(--card);border:1px solid var(--g);border-left:4px solid var(--g);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:grid;gap:4px}
.sl-card .sl-jd{font-size:12px;color:var(--mu)}
/* Multi-jd badge */
.multi-badge{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600}
/* Stats bar */
.stats-bar{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:10px}
.stat{text-align:center}.stat-val{font-size:20px;font-weight:700}.stat-label{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.03em}
/* Editable notes */
.inline-edit{border:1px dashed var(--bd);padding:2px 6px;border-radius:4px;min-width:60px;font:inherit;font-size:13px;background:transparent;color:var(--tx)}
.inline-edit:focus{border-color:var(--ac);outline:none;background:var(--bg)}
/* CV Match feature */
.cv-upload{border:2px dashed var(--bd);border-radius:16px;padding:48px 24px;text-align:center;cursor:pointer;transition:all .3s ease;background:var(--card);position:relative;overflow:hidden}
.cv-upload::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(79,70,229,.03),rgba(124,58,237,.03));opacity:0;transition:opacity .3s}.cv-upload:hover::before,.cv-upload.drag-over::before{opacity:1}
.cv-upload:hover,.cv-upload.drag-over{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 8px 24px rgba(79,70,229,.12)}
.cv-upload.drag-over{border-color:var(--purple);background:var(--purplebg)}
.cv-upload-icon{font-size:48px;margin-bottom:12px;display:block;filter:grayscale(.3);transition:filter .3s}.cv-upload:hover .cv-upload-icon{filter:none}
.cv-upload-title{font-size:18px;font-weight:700;margin-bottom:4px;color:var(--tx)}
.cv-upload-sub{font-size:13px;color:var(--mu)}
.cv-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.cv-progress{margin:20px 0;padding:20px;background:var(--card);border:1px solid var(--bd);border-radius:12px}
.cv-progress-bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin:10px 0}
.cv-progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--ac),var(--purple));transition:width .4s ease;width:0}
.cv-progress-text{font-size:13px;color:var(--mu);display:flex;justify-content:space-between}
.cv-extracted{margin:16px 0;padding:14px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;max-height:180px;overflow-y:auto;font-size:12px;color:var(--mu);line-height:1.6;white-space:pre-wrap;font-family:'Inter',monospace}
.cv-match-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:10px;transition:all .2s;position:relative;overflow:hidden}
.cv-match-card:hover{border-color:var(--ac);box-shadow:0 4px 16px rgba(0,0,0,.06);transform:translateY(-1px)}
.cv-match-rank{position:absolute;top:0;left:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border-radius:0 0 10px 0}
.cv-match-rank.top{background:linear-gradient(135deg,var(--ac),var(--purple));color:#fff}
.cv-match-rank.good{background:var(--gb);color:var(--g)}
.cv-match-rank.fair{background:var(--yb);color:var(--y)}
.cv-match-head{display:flex;align-items:center;gap:10px;margin-left:40px}
.cv-match-title{font-weight:700;font-size:15px;color:var(--tx);text-decoration:none;flex:1}.cv-match-title:hover{color:var(--ac);text-decoration:underline}
.cv-match-score{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.cv-match-meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 8px 40px;font-size:12px}
.cv-score-bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin:6px 40px 0}
.cv-score-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.4,0,.2,1);width:0}
.cv-score-fill.high{background:linear-gradient(90deg,var(--g),#22c55e)}
.cv-score-fill.medium{background:linear-gradient(90deg,var(--y),#f59e0b)}
.cv-score-fill.low{background:linear-gradient(90deg,var(--r),#ef4444)}
.cv-match-detail{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0 40px;font-size:13px}
@media(max-width:600px){.cv-match-detail{grid-template-columns:1fr}}
.cv-match-detail dt{color:var(--mu);font-weight:500}.cv-match-detail dd{margin:0;font-weight:600}
.cv-kw{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;margin:1px 2px}
.cv-kw.hit{background:var(--gb);color:var(--g)}.cv-kw.miss{background:var(--bg);color:var(--mu)}
.cv-exp-fit{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700}
.cv-exp-fit.yes{background:var(--gb);color:var(--g)}.cv-exp-fit.no{background:var(--rb);color:var(--r)}.cv-exp-fit.unknown{background:var(--bd);color:var(--mu)}
.cv-results-summary{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0;padding:14px;background:linear-gradient(135deg,rgba(79,70,229,.06),rgba(124,58,237,.06));border:1px solid var(--bd);border-radius:12px}
.cv-stat{text-align:center;flex:1;min-width:100px}.cv-stat-val{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.cv-stat-label{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.cv-file-info{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:12px 0}
.cv-file-icon{font-size:28px}.cv-file-name{font-weight:600;font-size:14px}.cv-file-size{font-size:12px;color:var(--mu)}
.cv-new-btn{margin-left:auto}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.cv-match-card{animation:slideUp .4s ease both}
.cv-match-card:nth-child(2){animation-delay:.05s}.cv-match-card:nth-child(3){animation-delay:.1s}.cv-match-card:nth-child(4){animation-delay:.15s}.cv-match-card:nth-child(5){animation-delay:.2s}
/* Shortlist per-company */
.sl-company-section{margin-bottom:24px}
.sl-company-header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:linear-gradient(135deg,rgba(79,70,229,.08),rgba(124,58,237,.08));border:1px solid var(--bd);border-radius:10px;margin-bottom:10px}
.sl-company-name{font-size:17px;font-weight:700;color:var(--ac);flex:1}
.sl-jd-section{margin-bottom:14px;padding-left:12px;border-left:3px solid var(--bd)}
.sl-jd-header{font-size:13px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;padding:4px 8px;background:var(--purplebg);border-radius:6px;display:inline-block}
.sl-card{background:var(--card);border:1px solid var(--g);border-left:4px solid var(--g);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:grid;gap:4px}
.sl-card .sl-jd{font-size:12px;color:var(--mu)}
/* Candidate pool upload */
.pool-upload{border:2px dashed var(--bd);border-radius:12px;padding:28px 20px;text-align:center;cursor:pointer;transition:all .3s;background:var(--card);position:relative}
.pool-upload:hover,.pool-upload.drag-over{border-color:var(--ac);background:var(--bluebg)}
.pool-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
/* Exp red-line badge */
.exp-fail-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--rb);color:var(--r);border:1px solid var(--r)}
.cv-excluded{opacity:.55;filter:grayscale(.4)}
.cv-exp-fail-banner{background:var(--rb);color:var(--r);border:1px solid var(--r);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;margin:4px 40px 0;display:flex;align-items:center;gap:6px}
/* Candidate pool badge */
.pool-badge{background:var(--bluebg);color:var(--blue);padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600}
/* ====== GiftAbled Management Dashboard ====== */
.mgmt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:14px 0}
.mgmt-stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:center}
.mgmt-stat-val{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2}
.mgmt-stat-label{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.mgmt-section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.mgmt-section h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.mgmt-table{width:100%;border-collapse:collapse;font-size:13px}
.mgmt-table th{text-align:left;padding:6px 10px;background:var(--bg);color:var(--mu);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--bd)}
.mgmt-table td{padding:7px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
.mgmt-table tr:last-child td{border-bottom:none}
.mgmt-table tr:hover td{background:var(--bg)}
/* ====== Caller Coordination ====== */
.caller-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.caller-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.caller-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--purple));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}
.caller-name{font-weight:700;font-size:16px}
.caller-meta{font-size:12px;color:var(--mu)}
.caller-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cstat{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:5px 12px;text-align:center;min-width:70px}
.cstat-val{font-size:18px;font-weight:700;color:var(--ac)}
.cstat-label{font-size:10px;color:var(--mu);text-transform:uppercase}
/* ====== HR Submission Tracker ====== */
.sub-card{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:8px;padding:12px;margin-bottom:8px}
.sub-status{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700}
.sub-submitted{background:var(--bluebg);color:var(--blue)}
.sub-selected{background:var(--gb);color:var(--g)}
.sub-rejected{background:var(--rb);color:var(--r)}
.sub-pending{background:var(--yb);color:var(--y)}
.sub-interview{background:var(--purplebg);color:var(--purple)}
/* ====== Job Fair Attendance ====== */
.jf-card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.jf-badge{padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.jf-confirmed{background:var(--gb);color:var(--g)}
.jf-pending{background:var(--yb);color:var(--y)}
.jf-declined{background:var(--rb);color:var(--r)}
.jf-noshow{background:var(--bd);color:var(--mu)}
/* ====== Duplicate Review ====== */
.dup-card{background:var(--card);border:1px solid var(--y);border-left:4px solid var(--y);border-radius:8px;padding:12px;margin-bottom:8px}
/* Inline edit */
.inline-edit{border:none;border-bottom:1px solid var(--bd);background:transparent;color:var(--tx);font:inherit;font-size:13px;padding:2px 4px;outline:none}
.inline-edit:focus{border-bottom-color:var(--ac)}

let S={ov:{},log:[],sl:{},qe:{},pool:[],uploadedCvs:[],callers:[],submissions:{},jfAttend:{}};

/* ====== Disability Benchmark Check ====== */
function parseDp(dp){
  if(!dp)return null;
  const m=dp.match(/[\d.]+/);
  if(!m)return null;
  let v=parseFloat(m[0]);
  if(v<=1)v=v*100; // handle 0.4 meaning 40%
  return v;
}
function disCheck(c){
  const dt=c.dt||'';
  const dp=c.dp||'';
  const pct=parseDp(dp);
  const hasType=!!dt.trim();
  const hasPct=pct!==null;
  const meetsMin=hasPct && pct>=40;
  return {hasType,hasPct,pct,meetsMin,
    ok: hasType && meetsMin,
    label: !hasType ? 'No disability info' : !hasPct ? 'No disability %' : !meetsMin ? `${pct}% < 40% benchmark` : `${pct}% ✓`,
    cls: (hasType && meetsMin)?'dis-ok':'dis-warn'
  };
}

/* ====== Experience Parsing & Strict Check ====== */
function parseYrs(t){
  if(!t)return null;
  t=t.toLowerCase();
  if(/fresh|no exp|nil|^0$/i.test(t))return 0;
  const ym=t.match(/(\d+)\s*year/);const mm=t.match(/(\d+)\s*month/);
  if(ym&&mm)return Math.round((parseInt(ym[1])+parseInt(mm[1])/12)*10)/10;
  const v=t.match(/\d+(?:\.\d+)?/g);
  if(!v||parseFloat(v[0])>40)return null;
  if(/month/.test(t)&&!/year/.test(t)&&v.length===1)return Math.round(parseFloat(v[0])/12*10)/10;
  if(v.length>=2&&/\d\s*[-–to]\s*\d/.test(t))return(parseFloat(v[0])+parseFloat(v[1]))/2;
  return parseFloat(v[0]);
}
function parseExpRange(e,title){
  if(!e)e='';
  e=e.toLowerCase();title=(title||'').toLowerCase();
  if(/fresher/.test(e)&&/experience/.test(e))return null;
  if(/fresher/.test(e)||((/fresher/.test(title))&&!e))return[0,1];
  let m=e.match(/(\d+)\s*[–\-]\s*(\d+)/);
  if(m)return[parseFloat(m[1]),parseFloat(m[2])];
  m=e.match(/(\d+)\s*(\+|yr|year)/);
  return m?[parseFloat(m[1]),null]:null;
}
function expMatch(candExp,jdExp,jdTitle){
  const y=parseYrs(candExp);
  const rng=parseExpRange(jdExp,jdTitle);
  if(y===null||rng===null)return {match:'unknown',y,rng,strict:false};
  const [lo,hi]=rng;
  const inRange=y>=lo && (hi===null||y<=hi+2);
  return {match:inRange?'yes':'no',y,rng,strict:!inRange};
}

/* ====== AI zone (recalculated with disability & experience strictness) ====== */
function ai(c,j){
  if(c._ai && c._ai_jid===j?.id)return c._ai;
  const base=c._a||(c._a={s:c.sc,z:c.sc>=D.thr[0]?'g':c.sc>=D.thr[1]?'y':'r',r:c.rs});
  if(!j){c._ai=base;c._ai_jid=null;return base}
  const dc=disCheck(c);
  const em=expMatch(c.e,j.e,j.t);
  let s=base.s;
  let reasons=[base.r];
  // Penalty: disability criteria not met -> cannot be green
  if(!dc.ok){
    reasons.push('⚠ Disability: '+dc.label);
    if(s>=D.thr[0])s=D.thr[0]-1; // drop from green
  }
  // Penalty: experience clearly out of range -> cannot be green
  if(em.strict){
    reasons.push('⚠ Experience mismatch: candidate '+em.y+'yrs vs JD '+(j.e||'not specified'));
    if(s>=D.thr[0])s=D.thr[0]-1;
  }
  const z=s>=D.thr[0]?'g':s>=D.thr[1]?'y':'r';
  const result={s,z,r:reasons.join('; ')};
  c._ai=result;c._ai_jid=j?.id;
  return result;
}
const jdOf=c=>S.ov[c.id]?.jd??c.jd;
const zone=(c,j)=>{
  const ov=S.ov[c.id]?.z;
  if(ov)return ov;
  return ai(c,j||D.jds[jdOf(c)]).z;
};
const gone=c=>!!S.ov[c.id]?.rm;
const byJd=id=>C.filter(c=>jdOf(c)===id);
function st(l,jdId){const o={g:0,y:0,r:0,n:0};const j=jdId!=null?D.jds[jdId]:null;l.forEach(c=>{if(gone(c))return;o[zone(c,j)]++;o.n++});return o}
const chips=o=>`<span class="chip cg">${o.g} green</span><span class="chip cy">${o.y} yellow</span><span class="chip cr">${o.r} red</span>`;
const set=(id,p,msg)=>{S.ov[id]=Object.assign(S.ov[id]||{},p);S.log.unshift(new Date().toLocaleString()+': '+msg);S.log=S.log.slice(0,100);save();render()};

const head=(t,sub,back)=>`${back?`<a class="back" href="${back[0]}">← ${E(back[1])}</a>`:''}<h1>${E(t)}</h1>${sub?`<p class="mu">${sub}</p>`:''}`;

/* ====== Screening Questions Generator ====== */
const Q_BANK={
  general:[
    {cat:'Introduction',q:'Can you briefly introduce yourself and walk me through your work experience?'},
    {cat:'Motivation',q:'Why are you interested in this role, and what attracted you to our company?'},
    {cat:'Accommodation',q:'Do you require any specific workplace accommodations or assistive technology? If yes, please describe.'},
    {cat:'Availability',q:'What is your notice period, and when can you join?'},
    {cat:'Salary',q:'What are your current and expected CTC?'},
    {cat:'Location',q:'Are you comfortable working from the specified location? Are you open to relocation if required?'},
  ],
  tech:[
    {cat:'Technical',q:'Can you describe a challenging technical problem you solved recently?'},
    {cat:'Technical',q:'What programming languages, frameworks, or tools are you proficient in?'},
    {cat:'Technical',q:'How do you stay updated with the latest technology trends?'},
    {cat:'Technical',q:'Describe your experience with debugging and troubleshooting production issues.'},
  ],
  nontech:[
    {cat:'Communication',q:'How do you handle difficult customer interactions or complaints?'},
    {cat:'Communication',q:'Can you give an example of a time you worked effectively in a team?'},
    {cat:'Process',q:'Describe a situation where you had to manage multiple tasks with tight deadlines.'},
    {cat:'Process',q:'How do you prioritize your daily tasks?'},
  ],
  leadership:[
    {cat:'Leadership',q:'Have you managed a team before? If yes, describe your management style.'},
    {cat:'Leadership',q:'How do you handle conflicts within your team?'},
  ],
  fresher:[
    {cat:'Academic',q:'Tell us about your educational background and any relevant projects.'},
    {cat:'Academic',q:'What skills from your studies do you think apply to this role?'},
    {cat:'Internship',q:'Have you completed any internships? What did you learn from them?'},
  ]
};
function genQuestions(j){
  const t=j.t.toLowerCase();const ty=j.ty.toLowerCase();const e=j.e.toLowerCase();
  let qs=[...Q_BANK.general];
  if(ty.includes('tech')&&!ty.includes('non'))qs.push(...Q_BANK.tech);
  else qs.push(...Q_BANK.nontech);
  if(/manager|lead|senior|sr\.|head/i.test(t))qs.push(...Q_BANK.leadership);
  if(/fresh|intern|0|entry/i.test(e+' '+t))qs.push(...Q_BANK.fresher);
  // Role-specific questions
  if(/network/i.test(t))qs.push({cat:'Role-Specific',q:'Explain your experience with L2/L3 networking, routing protocols, and network troubleshooting.'});
  if(/security|soc|infosec/i.test(t))qs.push({cat:'Role-Specific',q:'Describe your experience with SIEM tools, incident response, and vulnerability management.'});
  if(/data|analyst|bi/i.test(t))qs.push({cat:'Role-Specific',q:'What data analysis tools and databases have you worked with (SQL, Python, Tableau, etc.)?'});
  if(/customer|support|service|csa/i.test(t))qs.push({cat:'Role-Specific',q:'How do you handle high-pressure customer interactions? Describe a specific example.'});
  if(/sales|telesales/i.test(t))qs.push({cat:'Role-Specific',q:'What is your experience with sales targets? How do you handle rejection?'});
  if(/content|moderator/i.test(t))qs.push({cat:'Role-Specific',q:'Are you comfortable reviewing sensitive or graphic content? How do you manage the emotional impact?'});
  if(/engineer|developer|sde|fullstack|backend|frontend/i.test(t))qs.push({cat:'Role-Specific',q:'Describe a project you have built end-to-end. What was your architecture and tech stack?'});
  if(/devops|devsecops|infra/i.test(t))qs.push({cat:'Role-Specific',q:'What CI/CD tools and cloud platforms have you worked with?'});
  if(/picker|packer|warehouse|retail/i.test(t))qs.push({cat:'Role-Specific',q:'Are you comfortable with physical tasks such as standing, lifting, or moving inventory for extended periods?'});
  if(/account|finance/i.test(t))qs.push({cat:'Role-Specific',q:'Describe your experience with financial reporting, accounting software, or ERP systems.'});
  if(/plant|engineering|automation/i.test(t))qs.push({cat:'Role-Specific',q:'What experience do you have with plant operations, automation systems, or industrial equipment?'});
  return qs;
}
function getJdQuestions(jid){
  const saved=S.qe[jid];
  if(saved)return saved;
  const j=D.jds[jid];
  return genQuestions(j).map(q=>({cat:q.cat,q:q.q}));
}
function saveQuestion(jid,idx,val){
  if(!S.qe[jid])S.qe[jid]=[...getJdQuestions(jid)];
  S.qe[jid][idx].q=val;
  save();
}
function addQuestion(jid,cat,q){
  if(!S.qe[jid])S.qe[jid]=[...getJdQuestions(jid)];
  S.qe[jid].push({cat:cat||'Custom',q:q||'New question - click to edit'});
  save();render();
}
function removeQuestion(jid,idx){
  if(!S.qe[jid])S.qe[jid]=[...getJdQuestions(jid)];
  S.qe[jid].splice(idx,1);
  save();render();
}

/* ====== Multi-JD Candidates ====== */
function getMultiJdCandidates(){
  const map={};
  C.forEach(c=>{
    if(gone(c))return;
    const key=(c.em||c.ph||c.n).toLowerCase();
    if(!map[key])map[key]={person:c,jids:new Set()};
    map[key].jids.add(jdOf(c));
  });
  return Object.values(map).filter(x=>x.jids.size>1).sort((a,b)=>b.jids.size-a.jids.size);
}

/* ====== Shortlist ====== */
function isShortlisted(cid){return !!S.sl[cid]}
function toggleShortlist(cid,companyIdx){
  if(S.sl[cid]){
    delete S.sl[cid];
    S.log.unshift(new Date().toLocaleString()+': Removed from shortlist');
  } else {
    const c=C.find(x=>x.id===cid);
    const coIdx=companyIdx!=null?companyIdx:(c?jdOf(c)!=null?D.jds[jdOf(c)]?.c:c.co:undefined);
    S.sl[cid]={jd:jdOf(c),co:coIdx,ts:Date.now(),notes:''};
    S.log.unshift(new Date().toLocaleString()+': '+c.n+' shortlisted for company '+D.cos[coIdx]);
  }
  S.log=S.log.slice(0,100);save();render();
}
function shortlistTo(cid,coIdx,jdId){
  const c=C.find(x=>x.id===cid);
  if(!c)return;
  S.sl[cid]={jd:jdId!=null?jdId:jdOf(c),co:coIdx,ts:Date.now(),notes:S.sl[cid]?.notes||''};
  S.log.unshift(new Date().toLocaleString()+': '+c.n+' shortlisted → '+D.cos[coIdx]);
  S.log=S.log.slice(0,100);save();render();
}
function removeFromShortlist(cid){
  if(S.sl[cid]){
    const c=C.find(x=>x.id===cid);
    delete S.sl[cid];
    S.log.unshift(new Date().toLocaleString()+': '+(c?c.n:'Candidate')+' removed from shortlist');
    S.log=S.log.slice(0,100);save();render();
  }
}
function updateSlNotes(cid,notes){
  if(S.sl[cid])S.sl[cid].notes=notes;
  save();
}
function getShortlisted(){
  return Object.entries(S.sl).map(([cid,info])=>{
    const c=C.find(x=>x.id===cid);
    if(!c)return null;
    return{c,jd:D.jds[info.jd],info};
  }).filter(Boolean).sort((a,b)=>(b.info.ts||0)-(a.info.ts||0));
}
// Group shortlisted by company then JD
function getShortlistedByCompany(){
  const byCompany={};
  getShortlisted().forEach(item=>{
    const coIdx=item.info.co!=null?item.info.co:(item.jd?item.jd.c:null);
    if(coIdx==null)return;
    if(!byCompany[coIdx])byCompany[coIdx]={name:D.cos[coIdx],jds:{}};
    const jdId=item.info.jd;
    const jdKey=jdId!=null?jdId:'_unassigned';
    if(!byCompany[coIdx].jds[jdKey])byCompany[coIdx].jds[jdKey]={title:jdId!=null?(D.jds[jdId]?.t||'Unknown JD'):'Unassigned',items:[]};
    byCompany[coIdx].jds[jdKey].items.push(item);
  });
  return byCompany;
}

  const subInterview=subStatuses.filter(s=>s.status==='Interview Scheduled').length;

  const jfConfirmed=Object.values(S.jfAttend).filter(a=>a.status==='Confirmed'||a.status==='Travel Arranged'||a.status==='Attended').length;

    <div class="mgmt-stat"><div class="mgmt-stat-val">${subSubmitted}</div><div class="mgmt-stat-label">Submitted to HR</div></div>
    <div class="mgmt-stat"><div class="mgmt-stat-val">${subInterview}</div><div class="mgmt-stat-label">Interviews Sched.</div></div>
    <div class="mgmt-stat"><div class="mgmt-stat-val">${subSelected}</div><div class="mgmt-stat-label">Selected</div></div>

  // Company-wise summary table

  }

  return h;
}

/* ====== CALLER COORDINATION ====== */
function getCallerNames(){
  if(S.callers&&S.callers.length)return S.callers;
  return DEFAULT_CALLERS;
}
function getCallerForCand(cid){return(S.ov[cid]&&S.ov[cid].caller)||null;}
function setCallerForCand(cid,caller){S.ov[cid]=Object.assign(S.ov[cid]||{},caller?{caller}:{caller:null});save();}
function getCallStatus(cid){return(S.ov[cid]&&S.ov[cid].callStatus)||'Not Contacted';}
function setCallStatus(cid,st2){S.ov[cid]=Object.assign(S.ov[cid]||{},{callStatus:st2});save();}
function getCallerData(){
  const callers=getCallerNames();
  const data={};
  callers.forEach(name=>{data[name]={name,total:0,contacted:0,eligible:0,pending:0,callbacks:0,cands:[]};});
  C.forEach(c=>{
    if(gone(c))return;
    const caller=getCallerForCand(c.id);
    if(!caller||!data[caller])return;
    data[caller].total++;
    data[caller].cands.push(c);
    const cs=getCallStatus(c.id);
    if(['Contacted','Interested','Not Interested','Screening Pending','Eligible','Not Eligible'].includes(cs))data[caller].contacted++;
    if(cs==='Eligible')data[caller].eligible++;
    if(['Not Contacted','Call Pending','No Answer'].includes(cs))data[caller].pending++;
    if(cs==='Callback Required')data[caller].callbacks++;
  });
  return data;
}

// Tokenizer — improved with better stemming and full-word tracking
const CV_STOP=new Set('the and for with from work office location confirmed be to of in at grade a an is are was were has have had do does did will would can could should may might shall being been this that these those it its i me my we our you your he his she her they their them what which who whom when where how not no nor but or if then else than too very just also more most other some such only same so few between through during before after above below up down out off over under again further once here there all each every both any each few more most several do does did get got given given go goes going gone have has had having make makes making made take takes taking took run runs running ran say says said saying see sees seeing seen come comes coming came know knows knowing knew think thinks thinking thought tell tells telling told find finds finding found give gives gave giving work works working worked call calls called calling try tries trying tried need needs needing needed keep keeps keeping kept let lets letting leave leaves leaving left begin begins beginning began show shows showing showed seem seems seeming seemed help helps helping helped turn turns turning turned start starts starting started might should would could shall will may can must need want year years month months experience work working company role job position current total relevant'.split(' '));
const CV_LV=new Set('executive associate manager deputy senior sr asst assistant officer specialist trainee chief lead director vp president intern junior'.split(' '));

function cvToks(text){
  const d={};
  const words=text.toLowerCase().replace(/[^a-z0-9#+.\s]/g,' ').split(/\s+/);
  for(const w of words){
    if(w.length<2||CV_STOP.has(w)||CV_LV.has(w))continue;
    // Use 7-char stems for better precision (was 6)
    const k=w.length>7?w.slice(0,7):w;
    if(!d[k])d[k]=w;
  }
  return d;
}

// Full-word set for exact matching (no stemming)
function cvFullWords(text){
  return new Set(text.toLowerCase().replace(/[^a-z0-9#+.\s]/g,' ').split(/\s+/).filter(w=>w.length>=2));
}

// Extract years of experience from CV text
function cvParseExp(text){
  const t=text.toLowerCase();
  // Look for patterns like "X years of experience", "X+ years", "X yrs"
  const patterns=[
    /(\d+(?:\.\d+)?)\s*\+?\s*(?:years?|yrs?)\s*(?:of\s+)?(?:experience|exp|work)/i,
    /(?:experience|exp|work)\s*(?:of\s+|:?\s*)(\d+(?:\.\d+)?)\s*\+?\s*(?:years?|yrs?)/i,
    /(?:total|overall|relevant)\s*(?:experience|exp)\s*(?:of\s+|:?\s*)(\d+(?:\.\d+)?)\s*(?:years?|yrs?)/i,
    /(\d+(?:\.\d+)?)\s*(?:years?|yrs?)\s*(\d+)?\s*(?:months?|mos?)?/i,
  ];
  for(const p of patterns){
    const m=t.match(p);
    if(m){
      let y=parseFloat(m[1]);
      if(m[2])y+=parseInt(m[2])/12;
      if(y>0&&y<=40)return Math.round(y*10)/10;
    }
  }
  // Fresher check
  if(/\bfresher\b|\bfresh graduate\b|\b0\s*years?\s*experience/i.test(t))return 0;
  return null;
}

// Extract qualification level from CV text
function cvParseQual(text){
  const t=text.toLowerCase();
  if(/\b(ph\.?d|doctorate|doctoral)\b/i.test(t))return 5;
  if(/\b(m\.?tech|mtech|m\.?s\b|m\.?sc|mca|mba|m\.?com|m\.?a\b|master|post\s*graduat|pg\s*diploma)\b/i.test(t))return 4;
  if(/\b(b\.?tech|btech|b\.?e\b|b\.?sc|bca|b\.?com|b\.?a\b|bachelor|b\.?b\.?a|bbi|graduat|degree|ug)\b/i.test(t))return 3;
  if(/\b(diploma|polytechnic|iti)\b/i.test(t))return 2;
  if(/\b(12th|hsc|intermediate|10\+2)\b/i.test(t))return 1;
  return 0;
}

// Parse JD qualification requirements
function jdQualLevel(j){
  const t=(j.t+' '+(j.e||'')).toLowerCase();
  if(/ph\.?d|doctor/i.test(t))return 5;
  if(/m\.?tech|mba|mca|master|post\s*grad|pg/i.test(t))return 4;
  if(/b\.?tech|b\.?e\b|bca|b\.?com|bachelor|graduat|degree/i.test(t))return 3;
  if(/diploma|iti/i.test(t))return 2;
  return 0;// not specified
}

function matchCvToJds(cvText){
  const cvTokens=cvToks(cvText);
  const cvBag=new Set(Object.keys(cvTokens));
  const cvWords=cvFullWords(cvText);
  const cvExp=cvParseExp(cvText);
  const cvQual=cvParseQual(cvText);
  const cvLower=cvText.toLowerCase();
  const results=[];

  for(const j of D.jds){
    // Skip "Other" / catch-all JDs
    if(j.ty==='Not in JD sheet')continue;

    // Build rich JD profile from title + candidates
    const profile=buildJdProfile(j);
    const jdToks=cvToks(profile);
    const titleToks=cvToks(j.t);
    const jdBag=new Set(Object.keys(jdToks));
    const titleBag=new Set(Object.keys(titleToks));
    if(!titleBag.size&&!jdBag.size)continue;

    // === Signal 1: Title keyword match (0-30) ===
    const titleShared=new Set([...titleBag].filter(k=>cvBag.has(k)));
    const titleScore=titleBag.size>0?Math.round(30*(titleShared.size/Math.max(titleBag.size,1))):0;
    const matchedWords=[...titleShared].map(k=>cvTokens[k]||titleToks[k]);
    const missedWords=[...titleBag].filter(k=>!titleShared.has(k)).map(k=>titleToks[k]);

    // === Signal 2: Skill/profile overlap (0-25) ===
    const profileShared=new Set([...jdBag].filter(k=>cvBag.has(k)));
    const skillOverlapRatio=jdBag.size>0?profileShared.size/jdBag.size:0;
    const skillScore=Math.round(25*Math.min(1,skillOverlapRatio*2));// scale up so 50% overlap = full score

    // === Signal 3: Domain alignment (0-20) ===
    const domains=jdDomains(j);
    let domainScore=0;
    let domainMatches=[];
    if(domains.length>0){
      let domainHits=0;
      for(const dom of domains){
        const domKws=DOMAIN_SKILLS[dom]||[];
        const hits=domKws.filter(kw=>cvWords.has(kw)||cvLower.includes(kw));
        if(hits.length>0){
          domainHits++;
          domainMatches.push(...hits.slice(0,3));
        }
      }
      domainScore=Math.round(20*(domainHits/domains.length));
    }else{
      // No specific domain identified — give partial credit if general alignment exists
      const isTech=/tech/i.test(j.ty)&&!/non/i.test(j.ty);
      const cvHasTech=DOMAIN_SKILLS.tech_general.some(kw=>cvWords.has(kw)||cvLower.includes(kw));
      if(isTech&&cvHasTech)domainScore=12;
      else if(!isTech&&!cvHasTech)domainScore=10;
      else domainScore=4;
    }

    // === Signal 4: Experience fit — HARD RED LINE ===
    // If JD specifies experience and the CV experience is known but doesn't meet
    // the MINIMUM requirement, the candidate is EXCLUDED entirely (expFail=true).
    let expScore=8; // default: unknown
    let expFit='unknown';
    let expFail=false;
    const rng=parseExpRange(j.e,j.t);
    if(cvExp!==null&&rng!==null){
      const [lo,hi]=rng;
      const inRange=cvExp>=lo&&(hi===null||cvExp<=hi+2);
      if(inRange){
        expScore=15;expFit='yes';
      } else {
        expFit='no';
        // Hard disqualifier: if candidate clearly doesn't meet minimum experience
        // (more than 0.5 yr gap below minimum), exclude from results entirely.
        if(cvExp<lo-0.5){
          expFail=true; // will be excluded
        } else {
          // Within 0.5yr tolerance — penalise but don't exclude
          const gap=cvExp<lo?lo-cvExp:(hi!==null?cvExp-hi-2:0);
          expScore=Math.max(0,15-Math.round(gap*3));
        }
      }
    } else if(cvExp!==null&&rng===null){
      // JD has no experience range specified — neutral
      expScore=8;
    }

    // If experience fails the red line — skip this JD entirely
    if(expFail)continue;

    // === Signal 5: Qualification match (0-10) ===
    const jdQ=jdQualLevel(j);
    let qualScore=5; // neutral (JD doesn't specify)
    if(jdQ>0){
      if(cvQual>=jdQ)qualScore=10;
      else if(cvQual===jdQ-1)qualScore=6;
      else qualScore=2;
    }else if(cvQual>=3){
      qualScore=7; // graduate+ is generally good
    }

    const total=Math.min(100,titleScore+skillScore+domainScore+expScore+qualScore);
    if(total<8)continue;

    // Enrich matched words with domain skill matches
    const allMatched=[...new Set([...matchedWords,...domainMatches])].slice(0,10);

    const candCount=C.filter(c=>jdOf(c)===j.id&&!gone(c)).length;

    results.push({
      jd:j,
      score:total,
      kwScore:titleScore,
      skillScore,
      domainScore,
      expScore,
      qualScore,
      typeScore:domainScore,// backward compat for display
      matchedWords:allMatched,
      missedWords:missedWords.slice(0,6),
      expFit,
      cvExp,
      candCount
    });
  }

  results.sort((a,b)=>b.score-a.score);
  return results;
}

// Helper: extract candidate info from CV text (best-effort heuristics)
function cvExtractInfo(text){
  const t=text;
  const tl=t.toLowerCase();
  // Name: first non-empty line that looks like a name (2+ words, no digits, <40 chars)
  let name='';
  for(const line of t.split('\n')){
    const l=line.trim();
    if(l&&l.length<50&&l.split(/\s+/).length>=2&&!/\d/.test(l)&&!/[@:;,]/.test(l)){name=l;break;}
  }
  // Email
  const emM=t.match(/[\w.+-]+@[\w-]+\.[a-z]{2,}/i);
  const em=emM?emM[0]:'';
  // Phone (10-digit Indian numbers)
  const phM=t.replace(/[\s\-().+]/g,'').match(/(?:91)?(\d{10})/);
  const ph=phM?phM[1]:'';
  // Address: try to find lines with common address keywords
  const adLines=t.split('\n').filter(l=>/address|flat|house|street|road|nagar|colony|sector|city|pin|\d{6}/.test(l.toLowerCase())).slice(0,2);
  const ad=adLines.join(', ').trim();
  return{name,em,ph,ad};
}

/* processOneCv — extracts text, matches JDs, saves to uploadedCvs, returns result object */
async function processOneCv(file, progressCb){
  const ext=file.name.split('.').pop().toLowerCase();
  if(!['pdf','docx','doc','txt'].includes(ext)) throw new Error('Unsupported file type: '+file.name);
  progressCb(5,'Reading '+file.name+'...');
  const buf=await file.arrayBuffer();
  let text;
  if(ext==='pdf'){
    await loadPdf();
    progressCb(20,'Loading PDF...');
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    text='';
    for(let i=1;i<=pdf.numPages;i++){
      progressCb(20+50*(i/pdf.numPages),'Reading page '+i+'/'+pdf.numPages+'...');
      const page=await pdf.getPage(i);
      const tc=await page.getTextContent();
      text+=tc.items.map(x=>x.str).join(' ')+'\n';
    }
  } else if(ext==='docx'||ext==='doc'){
    await loadMammoth();
    progressCb(40,'Extracting DOCX text...');
    const result=await mammoth.extractRawText({arrayBuffer:buf});
    text=result.value;
  } else {
    text=new TextDecoder('utf-8').decode(buf);
  }
  progressCb(80,'Matching against JDs...');
  await new Promise(r=>setTimeout(r,50));
  const trimmed=text.trim();
  const cvExp=cvParseExp(trimmed);
  const cvQual=cvParseQual(trimmed);
  let expDisqualCount=0;
  for(const j of D.jds){
    if(j.ty==='Not in JD sheet')continue;
    if(cvExp!==null){
      const rng=parseExpRange(j.e,j.t);
      if(rng!==null&&cvExp<rng[0]-0.5)expDisqualCount++;
    }
  }
  const results=matchCvToJds(trimmed);
  progressCb(100,'Done!');
  // Build uploadedCvs entry
  const extracted=cvExtractInfo(trimmed);
  const top2=results.slice(0,2);
  const expYrs=cvExp;
  const isHitachi=(results.length===0)&&(expYrs!==null&&expYrs>=1);
  const ucEntry={
    _id:Date.now()+'_'+Math.random().toString(36).slice(2),
    fileName:file.name,
    fileSize:file.size,
    uploadedAt:new Date().toISOString(),
    name:extracted.name,
    em:extracted.em,
    ph:extracted.ph,
    ad:extracted.ad,
    expYrs,
    jd1:top2[0]?{company:D.cos[top2[0].jd.c],role:top2[0].jd.t,pct:top2[0].score}:null,
    jd2:top2[1]?{company:D.cos[top2[1].jd.c],role:top2[1].jd.t,pct:top2[1].score}:null,
    isHitachi,
    topMatches:results.slice(0,5).map(r=>({company:D.cos[r.jd.c],role:r.jd.t,pct:r.score}))
  };
  // Dedupe & save
  const dupKey=file.name+'|'+file.size;
  const existIdx=S.uploadedCvs.findIndex(u=>u.fileName+'|'+(u.fileSize||0)===dupKey);
  if(existIdx>=0)S.uploadedCvs[existIdx]=ucEntry;
  else S.uploadedCvs.push(ucEntry);
  S.log.unshift(new Date().toLocaleString()+': CV uploaded: '+file.name+(isHitachi?' (→ Hitachi bucket)':top2[0]?' (→ '+D.cos[top2[0].jd.c]+')':''));
  S.log=S.log.slice(0,100);
  save();
  return{file:{name:file.name,size:file.size,type:ext},text:trimmed,results,cvExp,cvQual,expDisqualCount,ucEntry};
}

/* handleCvFiles — main entry point for CV upload (single or batch) */
async function handleCvFiles(fileList){
  const files=[...fileList].filter(f=>/\.(pdf|docx|doc|txt)$/i.test(f.name));
  if(!files.length){alert('Please upload PDF, DOCX, DOC, or TXT files.');return;}

  const isBatch=files.length>1;

  if(!isBatch){
    // ---- SINGLE FILE: classic detailed-results flow ----
    const file=files[0];
    const ext=file.name.split('.').pop().toLowerCase();
    cvState={
      text:null,file:{name:file.name,size:file.size,type:ext},results:null,
      loading:true,progress:0,step:'Starting...',
      batch:[],batchIdx:0,batchTotal:1,batchResults:[],batchDone:false
    };
    render();
    try{
      const res=await processOneCv(file,(pct,step)=>{
        cvState.progress=pct;cvState.step=step;
        const bar=document.querySelector('.cv-progress-fill');
        const txt=document.querySelector('.cv-step-text');
        if(bar)bar.style.width=pct+'%';
        if(txt)txt.textContent=step;
      });
      cvState.text=res.text;
      cvState.cvExp=res.cvExp;
      cvState.cvQual=res.cvQual;
      cvState.expDisqualCount=res.expDisqualCount;
      cvState.results=res.results;
      cvState.loading=false;
      render();
      setTimeout(()=>document.querySelectorAll('.cv-score-fill[data-w]').forEach(el=>{el.style.width=el.dataset.w+'%'}),50);
    }catch(err){
      console.error(err);cvState.loading=false;
      alert('Error reading file: '+err.message);render();
    }
    return;
  }

  // ---- BATCH MODE: process files one by one ----
  cvState={
    text:null,file:null,results:null,
    loading:true,progress:0,step:'',
    batch:files,batchIdx:0,batchTotal:files.length,batchResults:[],batchDone:false
  };
  render();

  for(let i=0;i<files.length;i++){
    cvState.batchIdx=i;
    cvState.file={name:files[i].name,size:files[i].size,type:files[i].name.split('.').pop().toLowerCase()};
    cvState.step='Processing file '+(i+1)+' of '+files.length+': '+files[i].name;
    cvState.progress=0;
    // Update overall progress bar element if already rendered
    const obar=document.querySelector('.cv-progress-fill');
    const otxt=document.querySelector('.cv-step-text');
    if(obar)obar.style.width='0%';
    if(otxt)otxt.textContent=cvState.step;
    render();
    try{
      const res=await processOneCv(files[i],(pct,step)=>{
        cvState.progress=pct;
        cvState.step='File '+(i+1)+'/'+files.length+' — '+step;
        const bar=document.querySelector('.cv-progress-fill');
        const txt=document.querySelector('.cv-step-text');
        if(bar)bar.style.width=pct+'%';
        if(txt)txt.textContent=cvState.step;
      });
      cvState.batchResults.push(res);
    }catch(err){
      console.error('Batch error on',files[i].name,err);
      cvState.batchResults.push({file:{name:files[i].name,size:files[i].size,type:''},error:err.message,results:[],cvExp:null,cvQual:null,expDisqualCount:0});
    }
    await new Promise(r=>setTimeout(r,80));// brief yield between files
  }
  cvState.loading=false;
  cvState.batchDone=true;
  cvState.step='All '+files.length+' CVs processed!';
  render();
}

/* Legacy single-file entry point kept for backward compat */
async function handleCvFile(file){return handleCvFiles([file]);}

  if(cvState.results){

    h+=`<div class="cv-results-summary">

async function buildUploadedCvWb(){
  await loadX();
  const wb=new ExcelJS.Workbook();
  const list=S.uploadedCvs||[];
  // ---- Sheet 1: All uploaded CVs ----
  // Columns as requested:
  // Company Name | Job Role | % Match JD1 | % Match JD2 | Name | Mail id | Contact No | Current Organization |
  // Relevant experience in years | Relevant Skillset | Disability Type | Disability% | Current location |
  // Preferred Relocation | Current ctc | Expected ctc | Notice Period | Full Address | Upload cv | Column 1
  const UCOLS=['Company Name','Job Role','% Match (JD 1)','% Match (JD 2)','Name','Mail id','Contact No',
    'Current Organization','Relevant experience in years','Relevant Skillset','Disability Type','Disability%',
    'Current location','Preferred Relocation','Current ctc','Expected ctc','Notice Period','Full Address','Upload cv','Column 1'];

  function makeSheet(wb,name,items,coLabel){
    const wsName=(name||'CVs').replace(/[\\/?*\[\]:]/g,' ').slice(0,31);
    const ws=wb.addWorksheet(wsName);
    const hdr=ws.addRow(UCOLS);
    hdr.eachCell(x=>{x.font={bold:true,color:{argb:'FFFFFFFF'}};x.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1F2937'}};x.alignment={horizontal:'center',vertical:'middle',wrapText:true}});
    ws.getRow(1).height=22;
    items.forEach(u=>{
      // For each uploaded CV we output one row per JD match (up to 2), or one row if no match
      const matches=u.isHitachi?[{company:coLabel||'Hitachi',role:'General Pool',pct1:'N/A',pct2:'N/A'}]
        :u.topMatches&&u.topMatches.length?u.topMatches.slice(0,1).map((_,idx)=>({company:u.jd1?u.jd1.company:'',role:u.jd1?u.jd1.role:'',pct1:u.jd1?u.jd1.pct+'%':'',pct2:u.jd2?u.jd2.pct+'%':''}))
        :[{company:'',role:'',pct1:'',pct2:''}];
      matches.forEach(m=>{
        const row=ws.addRow([
          m.company,
          m.role,
          m.pct1,
          m.pct2,
          u.name||'',
          u.em||'',
          u.ph||'',
          '',// Current Organization – not easily parsed from CV text
          u.expYrs!=null?u.expYrs:'',
          '',// Relevant Skillset – not parsed
          '',// Disability Type
          '',// Disability%
          '',// Current location
          '',// Preferred Relocation
          '',// Current ctc
          '',// Expected ctc
          '',// Notice Period
          u.ad||'',
          u.fileName,
          ''// Column 1
        ]);
        // Light green fill for matched rows, light yellow for Hitachi
        const fg=u.isHitachi?'FFFFFF99':'FFEAFAF0';
        row.eachCell({includeEmpty:true},x=>{x.fill={type:'pattern',pattern:'solid',fgColor:{argb:fg}};x.alignment={vertical:'middle',wrapText:false}});
      });
    });
    [22,34,14,14,24,28,14,26,12,26,20,10,18,18,12,12,14,40,36,20].forEach((w,i)=>ws.getColumn(i+1).width=w);
    ws.views=[{state:'frozen',ySplit:1}];
    ws.autoFilter={from:'A1',to:{row:1,column:UCOLS.length}};
    return ws;
  }

  // Main sheet: all CVs
  makeSheet(wb,'All Uploaded CVs',list,'Hitachi');

  // Hitachi sheet (separate)
  const hitachiList=list.filter(u=>u.isHitachi);
  if(hitachiList.length)makeSheet(wb,'Hitachi Pool',hitachiList,'Hitachi');

  // Per-company sheets for matched CVs
  const byCompany={};
  list.filter(u=>!u.isHitachi&&u.jd1).forEach(u=>{
    const co=u.jd1.company;
    if(!byCompany[co])byCompany[co]=[];
    byCompany[co].push(u);
  });
  Object.entries(byCompany).forEach(([co,items])=>makeSheet(wb,co,items,co));

  return wb;
}

  try{await loadX()}catch(e){alert('Could not load Excel library.');return}

async function handlePoolFile(file){
  const ext=file.name.split('.').pop().toLowerCase();
  if(!['xlsx','xls','csv'].includes(ext)){
    alert('Please upload an Excel (.xlsx/.xls) or CSV file.');
    return;
  }
  poolState={loading:true,progress:0,step:'Loading library...',lastAdded:0,lastSkipped:0};
  render();
  try{
    // Load SheetJS
    await loadSheetJs();
    poolState.step='Reading file...';
    poolState.progress=20;
    render();
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    if(!rows.length){alert('The sheet appears empty.');poolState.loading=false;render();return;}

    poolState.step='Mapping columns...';
    poolState.progress=40;
    render();

    // Find column mappings from first row keys
    const colKeys=Object.keys(rows[0]);
    const mapping={};
    colKeys.forEach(k=>{
      const norm=k.trim().toLowerCase();
      if(POOL_COL_MAP[norm])mapping[k]=POOL_COL_MAP[norm];
    });

    let added=0,skipped=0;
    // Existing identifiers (email+phone) to avoid duplicates
    const existing=new Set(C.map(c=>((c.em||'')+'|'+(c.ph||'')).toLowerCase()));
    // Also include pool candidates already added
    S.pool.forEach(p=>existing.add(((p.em||'')+'|'+(p.ph||'')).toLowerCase()));

    const newCandidates=[];
    rows.forEach((row,i)=>{
      const candidate={src:file.name,pool:true,_poolIdx:Date.now()+'_'+i};
      Object.entries(mapping).forEach(([col,field])=>{
        candidate[field]=String(row[col]||'').trim();
      });
      // Skip blank rows
      if(!candidate.n&&!candidate.em&&!candidate.ph)return;
      // Skip duplicates
      const key=((candidate.em||'')+'|'+(candidate.ph||'')).toLowerCase();
      if(existing.has(key)){skipped++;return;}
      existing.add(key);
      newCandidates.push(candidate);
      added++;
    });

    poolState.step='Matching to JDs...';
    poolState.progress=70;
    render();

    // Assign each pool candidate to the best matching JD
    newCandidates.forEach(cand=>{
      let bestJd=null,bestScore=-1;
      D.jds.forEach(j=>{
        if(j.ty==='Not in JD sheet')return;
        // Simple role title match
        const roleText=(cand.role||cand.n||'').toLowerCase();
        const jdText=(j.t||'').toLowerCase();
        // Match on experience (hard red line)
        const expY=parseYrs(cand.e);
        const rng=parseExpRange(j.e,j.t);
        if(expY!==null&&rng!==null&&expY<rng[0]-0.5)return; // skip if experience doesn't meet minimum
        // Score: keyword overlap between role/skills and JD title
        let score=0;
        const roleWords=roleText.split(/\W+/).filter(w=>w.length>2);
        const jdWords=jdText.split(/\W+/).filter(w=>w.length>2);
        roleWords.forEach(w=>{if(jdWords.some(jw=>jw.startsWith(w.slice(0,5))))score++;});
        // Boost: skills alignment
        const skillText=(cand.sk||'').toLowerCase();
        jdWords.forEach(w=>{if(skillText.includes(w))score+=0.5;});
        if(score>bestScore){bestScore=score;bestJd=j;}
      });
      cand._matchedJd=bestJd?bestJd.id:null;
      cand._matchScore=bestScore;
    });

    poolState.step='Saving...';
    poolState.progress=90;
    render();

    S.pool.push(...newCandidates);
    S.log.unshift(new Date().toLocaleString()+': Uploaded pool file "'+file.name+'" — '+added+' added, '+skipped+' duplicates skipped');
    S.log=S.log.slice(0,100);
    save();

    // Reload C to include pool candidates
    rebuildCandidateList();

    poolState={loading:false,progress:100,step:'Done',lastAdded:added,lastSkipped:skipped};
    render();
  }catch(err){
    console.error(err);
    poolState.loading=false;
    alert('Error reading pool file: '+err.message);
    render();
  }
}

function rebuildCandidateList(){
  C=D.pl.map((p,i)=>Object.assign({id:'p'+i},D.people[p[1]],{jd:p[0],co:D.jds[p[0]].c,sc:p[2],rs:p[3],pool:p[4]}));
  // Add pool candidates
  S.pool.forEach((pc,i)=>{
    const pid='pool_'+i;
    const jdId=pc._matchedJd;
    const j=jdId!=null?D.jds[jdId]:null;
    C.push(Object.assign({},pc,{
      id:pid,
      jd:jdId,
      co:j?j.c:undefined,
      sc:50,// default score
      rs:'Pool candidate',
      pool:true
    }));
  });
}

  h+=`<div class="pool-upload" id="pool-drop">
    <input type="file" id="pool-file" accept=".xlsx,.xls,.csv">
    <div style="font-size:40px;margin-bottom:10px">📊</div>
    <div style="font-size:16px;font-weight:700;margin-bottom:4px">Drop your Excel / Google Sheet here</div>
    <div class="mu">or click to browse · .xlsx, .xls, .csv supported</div>
  </div>`;

  h+=`<div class="card" style="margin-top:14px">
    <h3 style="margin:0 0 8px">Recognized Column Headers</h3>
    <div style="display:flex;flex-wrap:wrap;gap:6px">`;
  const sampleCols=['Name','Email','Phone','Organization','Experience','Skills','Disability Type','Disability %','Location','Role','Qualification','Current CTC','Expected CTC','Notice Period','Timestamp'];
  sampleCols.forEach(c=>h+=`<span class="tag">${E(c)}</span>`);
  h+=`</div><p class="mu" style="font-size:12px;margin:8px 0 0">Column names are matched case-insensitively. Extra columns are ignored.</p></div>`;
  return h;
}

/* ====== Render & Events ====== */
const app=$('#app');
function updateNav(){
  const h=location.hash;
  document.querySelectorAll('.nav-links a').forEach(a=>{a.classList.toggle('active',a.getAttribute('href')===h||(!h&&a.id==='nav-home'))});
}
function render(){
  if(!D)return;
  updateNav();
  const[v,a]=location.hash.slice(2).split('/');
  app.innerHTML=v==='c'?vCo(a):v==='j'?vJd(a):v==='u'?vUn():v==='multi'?vMulti():v==='shortlist'?vShortlist():v==='cv'?vCvMatch():v==='pool'?vPoolUpload():v==='uploaded-cvs'?vUploadedCvs():v==='companies'?vCompanies():v==='callers'?vCallers():v==='submission'?vSubmission():v==='jobfair'?vJobFair():vHome();
  // Bind CV upload events
  if(v==='cv'&&!cvState.loading&&!cvState.results&&!cvState.batchDone){
    const drop=document.getElementById('cv-drop');
    const inp=document.getElementById('cv-file');
    if(drop){
      drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag-over')});
      drop.addEventListener('dragleave',()=>drop.classList.remove('drag-over'));
      // Accept multiple dropped files
      drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag-over');if(e.dataTransfer.files.length)handleCvFiles(e.dataTransfer.files)});
    }
    // Accept multiple selected files
    if(inp)inp.addEventListener('change',e=>{if(e.target.files.length)handleCvFiles(e.target.files)});
  }
  // Bind Pool upload events
  if(v==='pool'&&!poolState.loading){
    const drop=document.getElementById('pool-drop');
    const inp=document.getElementById('pool-file');
    if(drop){
      drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag-over')});
      drop.addEventListener('dragleave',()=>drop.classList.remove('drag-over'));
      drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag-over');if(e.dataTransfer.files[0])handlePoolFile(e.dataTransfer.files[0])});
    }
    if(inp)inp.addEventListener('change',e=>{if(e.target.files[0])handlePoolFile(e.target.files[0])});
  }
}

// Delegated change events
app.addEventListener('change',e=>{
  const t=e.target;
  const c=C.find(x=>x.id===(t.dataset.mv||t.dataset.as));
  if(c&&t.value){
    if(t.dataset.mv)set(c.id,{z:t.value},`${c.n}: ${ZN[zone(c)]} to ${ZN[t.value]}`);else set(c.id,{jd:+t.value},`${c.n}: assigned to ${D.jds[+t.value].t}`);
  }
  // Call status update
  if(t.dataset.csstatus){setCallStatus(t.dataset.csstatus,t.value);render();}
  // Sub status update
  if(t.dataset.subStatus){if(S.submissions[t.dataset.subStatus])S.submissions[t.dataset.subStatus].status=t.value;save();render();}
  // JF attendance status update
  if(t.dataset.jfStatus){if(S.jfAttend[t.dataset.jfStatus])S.jfAttend[t.dataset.jfStatus].status=t.value;save();render();}
});

app.addEventListener('input',e=>{
  const t=e.target;
  // Question editing
  if(t.dataset.qedit!==undefined){
    saveQuestion(+t.dataset.qedit,+t.dataset.qi,t.value);
  }
  // Shortlist notes editing
  if(t.dataset.slnote!==undefined){
    updateSlNotes(t.dataset.slnote,t.value);
  }
});

app.addEventListener('click',e=>{const b=e.target.closest('button,a[data-slrm]');if(!b)return;const d=b.dataset,f=k=>C.find(x=>x.id===d[k]);
  if(d.rm){pend=d.rm;render()}else if('rc' in d){pend=null;render()}
  else if(d.rm2){const c=f('rm2');pend=null;set(c.id,{rm:1},c.n+': removed')}
  else if(d.rs){const c=f('rs');set(c.id,{rm:0},c.n+': restored')}
  else if('sr' in d){showRm=!showRm;render()}
  else if(d.xl){dl(+d.xl)}
  else if(d.tab){activeTab=d.tab;render()}
  else if(d.sl){toggleShortlist(d.sl)}
  else if(d.slrm){removeFromShortlist(d.slrm)}
  else if(d.dlq){dlQ(+d.dlq)}
  else if(d.addq){addQuestion(+d.addq)}
  else if(d.rmq!==undefined){removeQuestion(+d.rmq,+d.rqi)}
  else if(d.resetq!==undefined){delete S.qe[+d.resetq];save();render()}
  else if('xlmulti' in d){dlMulti()}
  else if('xlsl' in d){dlSl()}
  else if('xlslAll' in d||b.dataset.xlslAll!=null){dlSlAll()}
  else if(d.xlslCo!=null){dlSlCo(+d.xlslCo)}
  else if('cvnew' in d){cvState={text:null,file:null,results:null,loading:false,progress:0,step:'',batch:[],batchIdx:0,batchTotal:0,batchResults:[],batchDone:false};render()}
  else if('clearpol' in d){if(confirm('Clear all '+S.pool.length+' pool candidates? This cannot be undone.')){S.pool=[];save();rebuildCandidateList();render()}}
  else if('dlUcvs' in d){dlUploadedCvs()}
  else if('clearUcvs' in d){if(confirm('Clear all '+S.uploadedCvs.length+' uploaded CVs? This cannot be undone.')){S.uploadedCvs=[];save();render()}}
  else if(d.rmUcv){const idx=S.uploadedCvs.findIndex(u=>u._id===d.rmUcv);if(idx>=0){S.uploadedCvs.splice(idx,1);save();render()}}
  // ====== GiftAbled Actions ======
  else if('saveCallers' in d){
    const ta=document.getElementById('caller-names-edit');
    if(ta){S.callers=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);save();render();}
  }
  else if('addSub' in d){
    const sl=getShortlisted();
    if(!sl.length){alert('No shortlisted candidates. Shortlist candidates first from JD pages.');return;}
    const names=sl.map(({c,jd},i)=>`${i+1}. ${c.n}${jd?' → '+jd.t:''}`).join('\n');
    const pick=prompt('Select a candidate number to add to HR Submission:\n\n'+names);
    if(!pick)return;
    const idx=parseInt(pick)-1;
    if(isNaN(idx)||idx<0||idx>=sl.length)return;
    const {c,jd}=sl[idx];
    const hrContact=prompt('HR contact/SPOC name (optional):','');
    const subId='sub_'+(Date.now());
    S.submissions[subId]={candidateName:c.n,phone:c.ph||'',email:c.em||'',cv:c.cv||'',jd:jd?jd.t:'',company:jd?D.cos[jd.c]:'',coIdx:jd?jd.c:-1,hrContact:hrContact||'',status:'Approved for Submission',date:new Date().toLocaleDateString('en-IN'),feedback:'',interviewDate:''};
    S.log.unshift(new Date().toLocaleString()+': Added '+c.n+' to HR Submission for '+(jd?jd.t:'?'));
    S.log=S.log.slice(0,100);
    save();render();
  }
  else if(d.subFeedback){
    const sub=S.submissions[d.subFeedback];
    if(!sub)return;
    const fb=prompt('Enter HR feedback for '+sub.candidateName+':',sub.feedback||'');
    if(fb===null)return;
    sub.feedback=fb;
    const intDate=prompt('Interview date (optional, e.g. 30 Oct 2026):',sub.interviewDate||'');
    if(intDate!==null)sub.interviewDate=intDate;
    save();render();
  }
  else if(d.subDel){
    if(confirm('Remove this submission record?')){delete S.submissions[d.subDel];save();render();}
  }
  // Job Fair Attendance
  else if('jfAddSl' in d){
    const sl=getShortlisted();
    if(!sl.length){alert('No shortlisted candidates. Shortlist candidates from JD pages first.');return;}
    let added2=0;
    sl.forEach(({c,jd})=>{
      const jfId='jf_'+c.id;
      if(!S.jfAttend[jfId]){
        S.jfAttend[jfId]={candidateName:c.n,phone:c.ph||'',jd:jd?jd.t:'',company:jd?D.cos[jd.c]:'',status:'Invitation Sent',travel:'',remarks:''};
        added2++;
      }
    });
    S.log.unshift(new Date().toLocaleString()+': Added '+added2+' candidates to Job Fair attendance tracker');
    S.log=S.log.slice(0,100);
    save();render();
  }
  else if('jfAdd' in d){
    const name=prompt('Candidate name:');
    if(!name)return;
    const phone=prompt('Phone number:','');
    const company=prompt('Company / JD:','');
    const jfId='jf_manual_'+Date.now();
    S.jfAttend[jfId]={candidateName:name,phone:phone||'',jd:'',company:company||'',status:'Invitation Sent',travel:'',remarks:''};
    save();render();
  }
});

addEventListener('hashchange',()=>{pend=null;showRm=false;activeTab='zones';render();scrollTo(0,0);
  const h2=location.hash;document.querySelectorAll('.nav-links a').forEach(a=>{a.classList.toggle('active',a.getAttribute('href')===h2||((!h2||h2==='#/')&&a.id==='nav-home'))});});
$('#reset').onclick=()=>{if(confirm('This will reset ALL your changes (zone moves, shortlists, notes, custom questions, pool candidates, callers, submissions, job fair data). Continue?')){S={ov:{},log:[],sl:{},qe:{},pool:[],uploadedCvs:[],callers:[],submissions:{},jfAttend:{}};save();rebuildCandidateList();render()}};


const api=async p=>{const r=await fetch('/api/data',{headers:{'x-password':p||''}});if(!r.ok)throw r.status;return r.json()};
function start(d){
  D=d;
  rebuildCandidateList();
  render();
}
function login(s,tried){app.innerHTML=s===503?'<div class="card"><b>Not configured yet.</b><p class="mu">Set SITE_PASSWORD (or PUBLIC_ACCESS=true) in Vercel and redeploy.</p></div>':`<div class="card" style="max-width:380px;margin:40px auto"><b style="font-size:18px">🔒 Password Required</b><p class="mu">${tried?'Wrong password. ':''}Ask the organiser for access.</p><input id="pw" type="password" placeholder="Enter password…" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)"><button id="go" class="btn-primary" style="width:100%;padding:10px">Open Dashboard</button></div>`;
  const go=$('#go');if(go)go.onclick=async()=>{const p=$('#pw').value;try{start(await api(p));try{sessionStorage.setItem('pw',p)}catch(e){}}catch(e){login(e,1)}}}
(async()=>{let p='';try{p=sessionStorage.getItem('pw')||''}catch(e){}try{start(await api(p))}catch(s){login(s,0)}})();
</script></body></html>
